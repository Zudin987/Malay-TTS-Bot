name: Prepare v0.23.25 Release

on:
  push:
    branches:
      - release/v0.23.25

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.23.25
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepare release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor 92344be598b05a10ef3ff123bd827cf33931b1a6 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Merged /ask buffered-fallback source is not an ancestor of this release branch.' }

          npm version 0.23.25 --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setup = Get-Content setup-clean.cmd -Raw
          if (-not $setup.Contains('clean setup v0.23.24')) { throw 'Expected v0.23.24 setup banner not found.' }
          $setup = $setup.Replace('clean setup v0.23.24','clean setup v0.23.25')
          Set-Content setup-clean.cmd -Value $setup -NoNewline -Encoding ascii

          $notes = @(
            'Malay TTS Bot v0.23.25 - /ask Buffered Fallback Hotfix',
            '',
            'What this fixes',
            '- Fixes /ask producing no audible speech when Gemini 3.1 TTS returned first audio but its stream later failed before completing.',
            '- /ask now buffers the dedicated Gemini 3.1 TTS result to completion before handing audio to Discord.',
            '- If Gemini 3.1 TTS fails during that buffered generation, the existing provider chain continues to Google Malay TTS before playback instead of accepting a broken first chunk.',
            '',
            'Preserved behavior',
            '- Normal Discord TTS remains low-latency streaming and is unchanged.',
            '- Normal provider order remains Gemini 3.1 Flash Live -> Gemini 2.5 Native Audio Live -> Gemini 3.1 Flash TTS -> Google Malay TTS.',
            '- /ask still skips conversational Live and uses Gemini 3.1 Flash TTS -> Google Malay TTS.',
            '- The /ask Gemini first-audio window remains up to 4000ms; buffering may add some start latency because playback now waits for a complete validated /ask TTS result.',
            '- Normal first-audio windows remain 2500/1600/1600ms, overall budget remains 7000ms, and Google reserve remains 1200ms.',
            '- 10-key round-robin, six-voice pool, prompts, privacy opt-out, STOP TTS, speaker labels, and normal queue behavior are unchanged.',
            '',
            'Upgrade',
            'Preserve .env and data\guilds.json. Do not copy old runtime caches, logs, locks, node_modules, or config/settings.json over the new release. Extract the clean package to C:\Malay-TTS-Bot, restore only .env and data\guilds.json, then run setup-clean.cmd.'
          ) -join "`r`n"
          Set-Content RELEASE-v0.23.25.txt -Value $notes -NoNewline -Encoding utf8

      - name: Validate release source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((node -p "require('./package.json').version").Trim() -ne '0.23.25') { throw 'package.json version mismatch.' }
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($lock.version -ne '0.23.25' -or $lock.packages[''].version -ne '0.23.25') { throw 'package-lock version mismatch.' }
          if (-not (Select-String -Path setup-clean.cmd -SimpleMatch 'clean setup v0.23.25')) { throw 'setup-clean version mismatch.' }
          if (-not (Test-Path RELEASE-v0.23.25.txt)) { throw 'release notes missing.' }

          $askResponse = Get-Content src/ask-response.js -Raw
          if (-not $askResponse.Contains('forceBuffered: true')) { throw '/ask buffered-fallback guard missing.' }
          if (-not $askResponse.Contains('skipLive: true')) { throw '/ask Live-skip guard missing.' }
          $askTest = Get-Content test/ask-literal-tts.test.js -Raw
          if (-not $askTest.Contains('item.metadata.forceBuffered, true')) { throw '/ask buffered regression guard missing.' }

          $settings = Get-Content config/settings.json -Raw | ConvertFrom-Json -AsHashtable
          if ($settings.providerHealth.primaryFirstAudioMs -ne 2500) { throw 'Primary first-audio window changed.' }
          if ($settings.providerHealth.fallbackFirstAudioMs -ne 1600) { throw 'Fallback first-audio window changed.' }
          if ($settings.providerHealth.exactFirstAudioMs -ne 1600) { throw 'Exact first-audio window changed.' }
          if ($settings.geminiTts.timeoutMs -ne 4000) { throw '/ask TTS timeout changed.' }
          if ($settings.geminiLive.firstAudioBudgetMs -ne 7000) { throw 'Overall first-audio budget changed.' }
          if ($settings.providerHealth.googleReserveMs -ne 1200) { throw 'Google reserve changed.' }

          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem -Recurse -Filter *.js |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' } |
            ForEach-Object {
              node --check $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Syntax failed: $($_.FullName)" }
            }
          foreach ($file in @('package.json','package-lock.json','config/settings.json')) {
            Get-Content $file -Raw | ConvertFrom-Json -AsHashtable | Out-Null
          }

      - name: Commit release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json setup-clean.cmd RELEASE-v0.23.25.txt
          git commit -m 'Release v0.23.25 - /ask Buffered Fallback Hotfix'
          git push origin HEAD:release/v0.23.25
