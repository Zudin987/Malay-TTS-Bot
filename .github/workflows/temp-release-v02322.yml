name: Prepare v0.23.22 release

on:
  push:
    branches:
      - release/v0.23.22

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[release-prep]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.23.22
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Prepare and validate release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm version 0.23.22 --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setup = Get-Content setup-clean.cmd -Raw
          $setup = $setup.Replace('clean setup v0.23.21', 'clean setup v0.23.22')
          Set-Content setup-clean.cmd -Value $setup -NoNewline

          $maintenance = Get-Content MAINTENANCE.md -Raw
          $maintenance = $maintenance.Replace('Current stable baseline: **v0.23.21 — Live-First Rollback**.', 'Current stable baseline: **v0.23.22 — /ask Key Auth Failover**.')
          Set-Content MAINTENANCE.md -Value $maintenance -NoNewline -Encoding utf8

          @'
          Malay TTS Bot v0.23.22 — /ask Key Auth Failover

          Confirmed reliability fix
          - Fixes /ask five-key round-robin behavior when the selected Gemini credential is invalid, expired, revoked, or disabled.
          - /ask now disables only the credential-bad key slot and immediately retries the next healthy configured Gemini key for the same command.
          - The bad slot stays out of runtime rotation until /restarttts or process restart, matching normal TTS credential handling.
          - Quota/rate-limit failures still do not rotate keys inside one /ask request.
          - Model/project PERMISSION_DENIED failures still do not disable a credential slot or rotate to another key.

          Regression coverage
          - Adds deterministic tests for bad-key failover to a healthy slot.
          - Locks quota and permission non-rotation behavior.
          - Locks explicit keyEntry test/injection behavior so it remains single-key and side-effect free.

          Audit result
          - Re-audited queue ownership, streaming prefetch, provider cancellation, Gemini Live completion, exact-TTS backpressure handling, Google fallback, STOP TTS, privacy opt-out, speaker-label caching, voice reconnect, persistence, bootstrap/single-instance, shutdown, config clamping, logging, and setup/CI paths.
          - No additional confirmed major correctness bug justified architectural changes in this patch.
          - The normal-message provider order remains Gemini 3.1 Flash Live -> Gemini 2.5 Native Audio Live -> Gemini 3.1 Flash TTS -> Google Malay TTS.
          - /ask remains dedicated Gemini 3.1 Flash TTS -> Google Malay TTS for speech; it is never routed through conversational Live.
          - exactFirstAudioMs remains 1600ms.

          Upgrade
          Preserve .env and data\guilds.json. Do not copy runtime caches/logs/locks from an old install. Run setup-clean.cmd after extracting the clean package.
          '@ | Set-Content RELEASE-v0.23.22.txt -Encoding utf8

          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(p.version!=='0.23.22'||l.version!=='0.23.22'||l.packages[''].version!=='0.23.22') process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Version metadata validation failed.' }
          if ((Get-Content setup-clean.cmd -Raw) -notmatch 'clean setup v0\.23\.22') { throw 'setup-clean.cmd version banner mismatch.' }
          if ((Get-Content MAINTENANCE.md -Raw) -notmatch 'v0\.23\.22 — /ask Key Auth Failover') { throw 'MAINTENANCE.md baseline mismatch.' }

      - name: Commit release metadata
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json setup-clean.cmd MAINTENANCE.md RELEASE-v0.23.22.txt
          git commit -m '[release-prep] Prepare v0.23.22 release'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:release/v0.23.22
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
