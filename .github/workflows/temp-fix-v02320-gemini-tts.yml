name: Prepare v0.23.20 Gemini TTS repair

on:
  push:
    branches:
      - fix/v0.23.20-gemini-tts

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Patch Gemini TTS request and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/providers/gemini.js')
          s = p.read_text()

          old = """function normalizeVoiceName(value) {\n  const match = GEMINI_VOICES.find((voice) => voice.toLowerCase() === String(value ?? '').trim().toLowerCase());\n  return match ?? GEMINI_VOICES[0];\n}\n"""
          new = old + """\nfunction sanitizeHttpErrorDetail(value, apiKey = '') {\n  let text = String(value ?? '');\n  const secret = String(apiKey ?? '').trim();\n  if (secret) text = text.split(secret).join('[redacted-api-key]');\n  return text\n    .replace(/([?&](?:key|api[_-]?key|apikey)=)[^&\\s)]+/giu, '$1[redacted]')\n    .replace(/\\bAIza[0-9A-Za-z_-]{20,}\\b/gu, '[redacted-api-key]')\n    .replace(/\\bBearer\\s+[A-Za-z0-9._~+\\/=\\-]+/giu, 'Bearer [redacted]')\n    .replace(/\\s+/gu, ' ')\n    .trim()\n    .slice(0, 1000);\n}\n"""
          if old not in s:
              raise SystemExit('normalizeVoiceName anchor not found')
          s = s.replace(old, new, 1)

          old_url = "response = await fetchImpl(`${ENDPOINT}?alt=sse`, {"
          if old_url not in s:
              raise SystemExit('streaming URL anchor not found')
          s = s.replace(old_url, "response = await fetchImpl(ENDPOINT, {", 1)
          s = s.replace("        'x-goog-api-client': 'malay-tts-bot/0.23.5',\n", "", 1)

          old_body = """      body: JSON.stringify((() => {\n        const turn = buildSpeechTurn(text, options.profile);\n        return {\n          model,\n          system_instruction: turn.systemInstruction,\n          input: turn.input,\n          response_format: { type: 'audio' },\n          generation_config: { speech_config: [{ voice: normalizeVoiceName(voiceName) }] },\n          stream: true,\n          store: false\n        };\n      })()),\n"""
          new_body = """      body: JSON.stringify({\n        model,\n        input: buildPrompt(text, options.profile),\n        response_format: { type: 'audio' },\n        generation_config: { speech_config: [{ voice: normalizeVoiceName(voiceName) }] },\n        stream: true,\n        store: false\n      }),\n"""
          if old_body not in s:
              raise SystemExit('request body anchor not found')
          s = s.replace(old_body, new_body, 1)

          old_err = """  if (!response.ok) {\n    linked.cleanup();\n    let body = null;\n    try { body = await response.json(); } catch {}\n    throw new GeminiTtsHttpError(response.status, body?.error?.status ?? null, body?.error?.message ?? '');\n  }\n"""
          new_err = """  if (!response.ok) {\n    linked.cleanup();\n    let rawBody = '';\n    try { rawBody = await response.text(); } catch {}\n    let body = null;\n    try { body = rawBody ? JSON.parse(rawBody) : null; } catch {}\n    const apiStatus = body?.error?.status ?? null;\n    const detail = sanitizeHttpErrorDetail(body?.error?.message ?? rawBody, apiKey);\n    throw new GeminiTtsHttpError(response.status, apiStatus, detail);\n  }\n"""
          if old_err not in s:
              raise SystemExit('HTTP error anchor not found')
          s = s.replace(old_err, new_err, 1)

          old_test_export = "export const __test = { makeBoundary, buildSpeechTurn, parseSseBlock, sniffAudioFormat, cancellationError };"
          if old_test_export not in s:
              raise SystemExit('__test export anchor not found')
          s = s.replace(old_test_export,
                        "export const __test = { makeBoundary, buildSpeechTurn, parseSseBlock, sniffAudioFormat, cancellationError, sanitizeHttpErrorDetail };", 1)
          p.write_text(s)

          p = Path('src/index.js')
          s = p.read_text()
          old = "Gemini TTS ready with Google Malay fallback. Fresh one-turn Live sessions; message combining disabled."
          new = "Gemini TTS configured with Google Malay fallback. Fresh one-turn Live sessions; message combining disabled."
          if old not in s:
              raise SystemExit('startup log anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('test/regression.test.js')
          s = p.read_text()
          old = """  assert.ok(body.system_instruction.includes('SPEECH_TEXT_START_'));\n  assert.ok(body.input.includes('ujian panjang'));\n"""
          new = """  assert.equal(body.system_instruction, undefined);\n  assert.ok(body.input.includes('SPEECH_TEXT_START_'));\n  assert.ok(body.input.includes('ujian panjang'));\n"""
          if old not in s:
              raise SystemExit('old exact-TTS request-shape regression anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

          cat > test/gemini-tts-request.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { synthesizeGemini } from '../src/providers/gemini.js';

          const endpoint = 'https://generativelanguage.googleapis.com/v1beta/interactions';

          test('Gemini 3.1 TTS uses the documented streaming Interactions request shape', async () => {
            const apiKey = 'fixture-secret-key-value';
            let captured = null;
            const fetchImpl = async (url, init) => {
              captured = { url, init };
              return new Response(JSON.stringify({
                error: { status: 'INVALID_ARGUMENT', message: `fixture request rejected; key=${apiKey}` }
              }), { status: 400, headers: { 'content-type': 'application/json' } });
            };

            await assert.rejects(
              synthesizeGemini('windows ke linux bagus', 'Charon', { apiKey, fetchImpl }),
              (error) => {
                assert.equal(error.status, 400);
                assert.equal(error.apiStatus, 'INVALID_ARGUMENT');
                assert.match(error.message, /fixture request rejected/i);
                assert.doesNotMatch(error.message, /fixture-secret-key-value/);
                return true;
              }
            );

            assert.equal(captured.url, endpoint);
            assert.equal(captured.init.method, 'POST');
            assert.equal(captured.init.headers['Api-Revision'], '2026-05-20');
            const body = JSON.parse(captured.init.body);
            assert.equal(body.model, 'gemini-3.1-flash-tts-preview');
            assert.equal(body.system_instruction, undefined);
            assert.match(body.input, /strict speech-synthesis engine/i);
            assert.match(body.input, /without adding, omitting, answering, translating, completing, paraphrasing, or rewriting/i);
            assert.match(body.input, /windows ke linux bagus/);
            assert.deepEqual(body.response_format, { type: 'audio' });
            assert.deepEqual(body.generation_config, { speech_config: [{ voice: 'Charon' }] });
            assert.equal(body.stream, true);
            assert.equal(body.store, false);
          });

          test('Gemini TTS surfaces sanitized plain-text HTTP 400 details', async () => {
            const apiKey = 'another-fixture-secret';
            const fetchImpl = async () => new Response(
              `INVALID_ARGUMENT: unsupported request field; api_key=${apiKey}`,
              { status: 400, headers: { 'content-type': 'text/plain' } }
            );
            await assert.rejects(
              synthesizeGemini('test', 'Despina', { apiKey, fetchImpl }),
              (error) => {
                assert.equal(error.status, 400);
                assert.match(error.message, /INVALID_ARGUMENT: unsupported request field/i);
                assert.doesNotMatch(error.message, /another-fixture-secret/);
                return true;
              }
            );
          });

          test('startup wording says Gemini TTS is configured, not preflight-ready', () => {
            const source = fs.readFileSync(new URL('../src/index.js', import.meta.url), 'utf8');
            assert.match(source, /Gemini TTS configured with Google Malay fallback/);
            assert.doesNotMatch(source, /Gemini TTS ready with Google Malay fallback/);
          });
          EOF

          npm ci
          npm test
          npm audit --audit-level=high
          node --check src/providers/gemini.js
          node --check src/index.js
          node --check test/gemini-tts-request.test.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/providers/gemini.js src/index.js test/regression.test.js test/gemini-tts-request.test.js
          git commit -m 'Repair Gemini 3.1 TTS request and error diagnostics'
          git rm .github/workflows/temp-fix-v02320-gemini-tts.yml
          git commit -m 'Remove temporary Gemini TTS repair workflow'
          git push origin HEAD:fix/v0.23.20-gemini-tts
