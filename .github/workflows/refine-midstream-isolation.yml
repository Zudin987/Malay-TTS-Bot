name: Refine Live midstream isolation

on:
  push:
    branches:
      - fix/runaway-isolation-v3

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runaway-isolation-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Live midstream health refinement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('src/tts.js',
          '''function observeCompletion(key, state, generated, providerName, requestStartedAt, options, geminiProvider, configSignature) {''',
          '''function shouldIsolateLiveMidstreamFailure(error, key) {\n  if (key !== 'livePrimary' && key !== 'liveFallback') return false;\n  // Quota, credentials, access and invalid request/config errors describe a\n  // real condition that can affect the next fresh Live turn. Temporary errors\n  // after first audio do not: each Discord message opens a new one-turn session.\n  return !error?.dailyQuotaLike\n    && !error?.quotaLike\n    && !error?.authLike\n    && !error?.permissionLike\n    && !error?.configLike;\n}\n\nfunction recordIsolatedLiveMidstreamFailure(state, error, key = 'unknown') {\n  state.failureCount += 1;\n  state.midstreamFailureCount += 1;\n  state.lastFailureAt = Date.now();\n  state.lastError = sanitizeProviderError(error);\n  state.lastFailureKind = error?.transportLike ? 'midstream/transport' : 'midstream/temporary';\n  // Do not increment consecutiveFailures or apply a provider cooldown. Recovery\n  // still handles the current audio; the next message gets a fresh Live turn.\n  releaseHalfOpenProbe(key, state);\n}\n\nfunction observeCompletion(key, state, generated, providerName, requestStartedAt, options, geminiProvider, configSignature) {''')

          replace_once('src/tts.js',
          '''    if (error?.runawayLike) {\n      recordRunawayMidstreamFailure(state, error, key);\n      console.warn(`[provider-runaway:${providerName}] phase=midstream isolated=true message=${sanitizeProviderError(error)}`);\n      return;\n    }\n    const budget = Boolean(error?.budgetLike || error?.name === 'TtsFailoverBudgetError');''',
          '''    if (error?.runawayLike) {\n      recordRunawayMidstreamFailure(state, error, key);\n      console.warn(`[provider-runaway:${providerName}] phase=midstream isolated=true message=${sanitizeProviderError(error)}`);\n      return;\n    }\n    if (shouldIsolateLiveMidstreamFailure(error, key)) {\n      recordIsolatedLiveMidstreamFailure(state, error, key);\n      console.warn(`[provider-midstream:${providerName}] isolated=true message=${sanitizeProviderError(error)}`);\n      return;\n    }\n    const budget = Boolean(error?.budgetLike || error?.name === 'TtsFailoverBudgetError');''')

          replace_once('src/tts.js',
          '''export const __test = { makeBudgetError, setProviderFailure, recordRunawayMidstreamFailure, newProviderState, bufferGenerated, healthOptions, exactFirstAudioWindowCap, pacificDailyResetMs, recordGeminiQuotaFailure, providerReady, acquireGeminiSlot, runAttempt, providerConfigSignature, beginHalfOpenProbe, releaseHalfOpenProbe, sanitizeProviderText, sanitizeProviderError };''',
          '''export const __test = { makeBudgetError, setProviderFailure, recordRunawayMidstreamFailure, recordIsolatedLiveMidstreamFailure, shouldIsolateLiveMidstreamFailure, newProviderState, bufferGenerated, healthOptions, exactFirstAudioWindowCap, pacificDailyResetMs, recordGeminiQuotaFailure, providerReady, acquireGeminiSlot, runAttempt, providerConfigSignature, beginHalfOpenProbe, releaseHalfOpenProbe, sanitizeProviderText, sanitizeProviderError };''')

          p = Path('test/runaway-isolation.test.js')
          text = p.read_text(encoding='utf-8')
          anchor = "test('runaway Live output never schedules cutoff recovery', () => {"
          addition = """test('temporary Live midstream timeout is counted without poisoning next-turn health', () => {\n  const state = tts.__test.newProviderState();\n  const error = Object.assign(new Error('Gemini Live audio stream timed out after 3500ms.'), { transportLike: true });\n  assert.equal(tts.__test.shouldIsolateLiveMidstreamFailure(error, 'livePrimary'), true);\n  tts.__test.recordIsolatedLiveMidstreamFailure(state, error, 'livePrimary');\n  assert.equal(state.failureCount, 1);\n  assert.equal(state.midstreamFailureCount, 1);\n  assert.equal(state.consecutiveFailures, 0);\n  assert.equal(state.cooldownUntil, 0);\n  assert.equal(state.cooldownReason, null);\n  assert.equal(state.lastFailureKind, 'midstream/transport');\n});\n\ntest('serious Live quota/auth/config failures are not isolated', () => {\n  assert.equal(tts.__test.shouldIsolateLiveMidstreamFailure({ quotaLike: true }, 'livePrimary'), false);\n  assert.equal(tts.__test.shouldIsolateLiveMidstreamFailure({ authLike: true }, 'livePrimary'), false);\n  assert.equal(tts.__test.shouldIsolateLiveMidstreamFailure({ configLike: true }, 'livePrimary'), false);\n  assert.equal(tts.__test.shouldIsolateLiveMidstreamFailure({ transportLike: true }, 'exactTts'), false);\n});\n\n"""
          if text.count(anchor) != 1:
              raise SystemExit('test anchor missing or duplicated')
          p.write_text(text.replace(anchor, addition + anchor, 1), encoding='utf-8')
          PY
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check src/tts.js
          node --check test/runaway-isolation.test.js
      - name: Full regression suite
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Commit refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tts.js test/runaway-isolation.test.js
          git commit -m "Isolate post-first-audio Live failures"
          git push origin HEAD:fix/runaway-isolation-v3
