name: Temporary v0.23.15 lock sync

on:
  push:
    branches:
      - release/v0.23.15
    paths:
      - .github/workflows/temp-v02315-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.23.15
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Sync package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify versions
        run: node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='0.23.15'||l.version!==p.version||l.packages[''].version!==p.version) process.exit(1)"
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync v0.23.15 package lock"
          git push origin HEAD:release/v0.23.15
