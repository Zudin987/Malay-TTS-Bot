name: Temp repeated recovery audit gate

on:
  push:
    branches:
      - fix/recovery-evidence-and-live-guard

permissions:
  contents: read

jobs:
  repeat-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/recovery-evidence-and-live-guard
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Five consecutive full regression passes
        shell: pwsh
        run: |
          1..5 | ForEach-Object {
            Write-Host "=== Windows recovery audit pass $_/5 ==="
            npm test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  repeat-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/recovery-evidence-and-live-guard
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Five consecutive full regression passes
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "=== Ubuntu recovery audit pass $i/5 ==="
            npm test
          done
