name: v0.23.8 Repeated Regression Gate

on:
  push:
    branches:
      - release/v0.23.8

jobs:
  windows-repeat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.23.8
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run full suite five times
        shell: pwsh
        run: |
          1..5 | ForEach-Object {
            Write-Host "=== Windows regression pass $_/5 ==="
            npm test
            if ($LASTEXITCODE -ne 0) { throw "Regression pass $_ failed" }
          }

  ubuntu-repeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.23.8
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run full suite five times
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "=== Ubuntu regression pass $i/5 ==="
            npm test
          done
