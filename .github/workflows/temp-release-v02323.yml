name: Prepare v0.23.23 release

on:
  push:
    branches:
      - release/v0.23.23

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.23.23
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepare v0.23.23 metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm version 0.23.23 --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setup = Get-Content setup-clean.cmd -Raw
          $setup = $setup.Replace('clean setup v0.23.22', 'clean setup v0.23.23')
          Set-Content setup-clean.cmd -Value $setup -NoNewline

          $maintenance = Get-Content MAINTENANCE.md -Raw
          $maintenance = [regex]::Replace($maintenance, 'Current stable baseline: \*\*v0\.23\.22[^\r\n]*', 'Current stable baseline: **v0.23.23 - 10-Key Round-Robin + /ask TTS Fix**.')
          Set-Content MAINTENANCE.md -Value $maintenance -NoNewline -Encoding utf8

          @'
          Malay TTS Bot v0.23.23 - 10-Key Round-Robin + /ask TTS Fix

          Gemini API key expansion
          - Expands the Gemini API key round-robin from 5 to 10 configured slots.
          - Supports GEMINI_API_KEY plus GEMINI_API_KEY_2 through GEMINI_API_KEY_10.
          - Empty slots are skipped, slot 10 can be selected as the starting slot, and secret-safe logs continue to show slot numbers only.
          - Credential-auth failures still disable only the bad slot until /restarttts or a full process restart.
          - Quota/rate-limit and model/project permission failures keep their existing non-rotation behavior.
          - Editing .env still requires a full bot process restart to load added or changed keys.

          /ask Gemini 3.1 TTS reliability fix
          - Fixes /ask repeatedly falling through to Google because dedicated Gemini 3.1 TTS was capped by the normal 1600ms exact-TTS fallback window.
          - /ask continues to skip conversational Live, but dedicated Gemini 3.1 TTS now gets the configured 4000ms first-audio timeout before Google fallback.
          - Normal Live-first chat keeps exactFirstAudioMs at 1600ms, preserving its existing latency behavior.
          - The overall first-audio budget remains 7000ms and the Google reserve remains 1200ms.

          Regression and compatibility
          - Adds full 1 -> 10 -> 1 round-robin regression coverage and slot-10 start/empty-slot coverage.
          - Adds a regression guard proving normal chat remains 1600ms while /ask receives the 4000ms exact-TTS window.
          - Normal provider order remains Gemini 3.1 Flash Live -> Gemini 2.5 Native Audio Live -> Gemini 3.1 Flash TTS -> Google Malay TTS.
          - /ask speech remains Gemini 3.1 Flash TTS -> Google Malay TTS and is never routed through conversational Live.
          - Voice pool, queue ownership, privacy opt-out, STOP TTS, speaker labels, and exact read-aloud behavior are unchanged.

          Upgrade
          Preserve .env and data\guilds.json. Do not copy old runtime caches, logs, locks, node_modules, or config/settings.json over the new release. Extract the clean package to C:\Malay-TTS-Bot, restore only .env and data\guilds.json, then run setup-clean.cmd.
          '@ | Set-Content RELEASE-v0.23.23.txt -Encoding utf8

      - name: Validate release repeatedly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem -Recurse -Filter *.js |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' } |
            ForEach-Object {
              node --check $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

          node -e "const fs=require('fs'),p=require('path'); const files=['package.json','package-lock.json',...fs.readdirSync('config').filter(x=>x.endsWith('.json')).map(x=>p.join('config',x))]; for(const f of files) JSON.parse(fs.readFileSync(f,'utf8')); console.log('Validated '+files.length+' JSON file(s).')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          1..5 | ForEach-Object {
            Write-Host "Regression pass $_/5"
            npm test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(p.version!=='0.23.23'||l.version!=='0.23.23'||l.packages[''].version!=='0.23.23') process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Version metadata validation failed.' }
          if ((Get-Content setup-clean.cmd -Raw) -notmatch 'clean setup v0\.23\.23') { throw 'setup-clean.cmd version banner mismatch.' }
          if ((Get-Content MAINTENANCE.md -Raw) -notmatch 'v0\.23\.23 - 10-Key Round-Robin \+ /ask TTS Fix') { throw 'MAINTENANCE.md baseline mismatch.' }
          if (-not (Test-Path RELEASE-v0.23.23.txt)) { throw 'Release notes missing.' }

      - name: Commit release metadata and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/temp-release-v02323.yml -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json setup-clean.cmd MAINTENANCE.md RELEASE-v0.23.23.txt .github/workflows/temp-release-v02323.yml
          git commit -m '[release-prep] Prepare v0.23.23 release'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:release/v0.23.23
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
