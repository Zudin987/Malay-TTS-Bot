name: Prepare v0.23.12 release

on:
  push:
    branches:
      - release/v0.23.12

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[release-prep]') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.23.12
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepare and validate release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm version 0.23.12 --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setup = Get-Content setup-clean.cmd -Raw
          $setup = $setup.Replace('clean setup v0.23.11', 'clean setup v0.23.12')
          Set-Content setup-clean.cmd -Value $setup -NoNewline

          $maintenance = Get-Content MAINTENANCE.md -Raw
          $maintenance = $maintenance.Replace('Current stable baseline: **v0.23.11 — Recovery Evidence & Stale-Tail Hardening**.', 'Current stable baseline: **v0.23.12 — Gemini Live-First Read-Aloud**.')
          Set-Content MAINTENANCE.md -Value $maintenance -NoNewline -Encoding utf8

          @'
          Malay TTS Bot v0.23.12 — Gemini Live-First Read-Aloud

          Main change
          - Every normal user-authored Discord message now tries Gemini 3.1 Live first regardless of wording, punctuation, question form, Malay particles, or assistant-like phrasing.
          - Removed content-based provider bypasses that previously sent messages beginning with words such as "ada", "dah", "belum", and "boleh" away from Gemini Live.
          - Questions such as "ada event apa", "what current event?", and assistant-like text such as "tell me a joke" now still use Gemini 3.1 Live first.
          - Internal recovery/fallback items may still explicitly skip Live so a recovered tail is not sent through the conversational model again.
          - The strict read-aloud system instruction remains responsible for making Gemini speak the transcript instead of answering it.

          Important trade-off
          - Gemini Live is a conversational native-audio model. Prompting strongly reduces assistant-style answers, but zero-answer behavior cannot be mathematically guaranteed while preserving immediate streaming playback. Fully validating speech before playback would add latency and is intentionally not enabled.

          Compatibility
          - Provider order remains Gemini 3.1 Live -> Gemini 2.5 Live -> Gemini 3.1 TTS -> Google Malay.
          - Recovery hardening from v0.23.11 is unchanged.
          - Speaker labels, key selection, queueing, and voice configuration are unchanged.

          Upgrade
          Preserve .env and data\guilds.json. Use the new release files. Existing v0.23.11 config/settings.json remains compatible because this routing change is code-level.
          '@ | Set-Content RELEASE-v0.23.12.txt -Encoding utf8

          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(p.version!=='0.23.12'||l.version!=='0.23.12'||l.packages[''].version!=='0.23.12') process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Version metadata validation failed.' }

      - name: Commit release metadata
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json setup-clean.cmd MAINTENANCE.md RELEASE-v0.23.12.txt
          git commit -m '[release-prep] Prepare v0.23.12 release'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:release/v0.23.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
