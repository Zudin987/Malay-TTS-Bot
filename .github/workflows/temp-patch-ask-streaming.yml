name: Prepare ask streaming latency fix
on:
  push:
    branches:
      - fix/ask-streaming-latency-queue
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ask-streaming-latency-queue
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace('src/ask-response.js',
          """      // /ask prioritizes a complete audible answer over first-chunk latency.\n      // This selects a bounded completed-response Gemini 3.1 TTS request instead\n      // of streaming SSE into a buffer. On failure it falls through to Google.\n      forceBuffered: true\n""",
          """      // /ask uses dedicated Gemini 3.1 TTS, but starts playback from the\n      // first streamed audio chunk. This keeps conversational Live excluded while\n      // avoiding the multi-second full-answer buffering delay.\n      forceBuffered: false,\n      // Do not synthesize queued /ask answers speculatively. Repeated /ask calls\n      // should not occupy Gemini slots for audio that cannot play yet.\n      noPrefetch: true\n""")

          replace('src/ask-response.js',
          """    enqueue,\n    cancel\n  } = dependencies;\n""",
          """    enqueue,\n    cancel,\n    cancelQueuedAsk\n  } = dependencies;\n""")

          replace('src/ask-response.js',
          """  const audio = getAudioStatus(interaction.guildId);\n  if (audio && Number(audio.queued) >= Number(audio.maximumQueued)) return 'queue-full';\n""",
          """  // A newer /ask from the same user supersedes only their older queued\n  // /ask speech. Never interrupt the answer that is already speaking, and never\n  // touch normal message TTS. This prevents stale /ask answers building a long\n  // FIFO backlog during rapid follow-up questions.\n  cancelQueuedAsk?.(interaction.guildId, interaction.user.id);\n\n  const audio = getAudioStatus(interaction.guildId);\n  if (audio && Number(audio.queued) >= Number(audio.maximumQueued)) return 'queue-full';\n""")

          replace('src/audio.js',
          """    forceBuffered: metadata.forceBuffered === true,\n    recoveryAttempt: Math.max(0, Number(metadata.recoveryAttempt) || 0),\n""",
          """    forceBuffered: metadata.forceBuffered === true,\n    noPrefetch: metadata.noPrefetch === true,\n    recoveryAttempt: Math.max(0, Number(metadata.recoveryAttempt) || 0),\n""")

          replace('src/audio.js',
          """function prefetchNext(guildId, state) {\n  if (state.disposed || state.queue.length === 0) return;\n  const options = getAdaptiveQueueOptions();\n  const candidates = selectPrefetchCandidates(state.queue, { ahead: getPrefetchAhead(state) });\n""",
          """function hasPrefetchBarrier(queue) {\n  const firstUnstarted = (Array.isArray(queue) ? queue : []).find((item) => !item.generation);\n  return Boolean(firstUnstarted?.noPrefetch);\n}\nfunction prefetchNext(guildId, state) {\n  if (state.disposed || state.queue.length === 0 || hasPrefetchBarrier(state.queue)) return;\n  const options = getAdaptiveQueueOptions();\n  const candidates = selectPrefetchCandidates(state.queue, { ahead: getPrefetchAhead(state) });\n""")

          replace('src/audio.js',
          """export function cancelMessageAudio(guildId, messageId) {\n""",
          """function cancelQueuedAskItemsForUser(state, userId) {\n  const id = String(userId ?? '');\n  if (!state || !id || !Array.isArray(state.queue)) return 0;\n  let cancelled = 0;\n  const kept = [];\n  for (const item of state.queue) {\n    const isQueuedAsk = String(item?.messageId ?? '').startsWith('ask:');\n    if (isQueuedAsk && String(item?.userId ?? '') === id) {\n      cancelled += 1;\n      cleanupCancelledQueuedItem(item);\n    } else kept.push(item);\n  }\n  state.queue = kept;\n  return cancelled;\n}\n\nexport function cancelQueuedAskAudioForUser(guildId, userId) {\n  const state = states.get(guildId);\n  const cancelled = cancelQueuedAskItemsForUser(state, userId);\n  if (state && !state.running && state.voiceReady && state.queue.length) void runQueue(guildId, state);\n  return cancelled;\n}\n\nexport function cancelMessageAudio(guildId, messageId) {\n""")

          replace('src/audio.js',
          """export const __test = { mp3DurationMs, decideSpeakerLabel, buildPcmTail, buildTranscriptTextTail, handleCompletionRecovery, getGeneratedAudioDurationMs, getRecoveryResumeStartMs, createQueueItem, cancelQueuedItemsForUser, cancelCurrentItemForUser, createPrefetchSpool, wireProviderToInput, scheduleRecovery, scheduleCompletionGraceCancel, canRunQueue, takeNextItem, abandonUnclaimedGeneration };\n""",
          """export const __test = { mp3DurationMs, decideSpeakerLabel, buildPcmTail, buildTranscriptTextTail, handleCompletionRecovery, getGeneratedAudioDurationMs, getRecoveryResumeStartMs, createQueueItem, cancelQueuedItemsForUser, cancelQueuedAskItemsForUser, cancelCurrentItemForUser, createPrefetchSpool, wireProviderToInput, scheduleRecovery, scheduleCompletionGraceCancel, canRunQueue, takeNextItem, abandonUnclaimedGeneration, hasPrefetchBarrier };\n""")

          replace('src/commands.js',
          """import { cancelMessageAudio, cancelUserAudio, enqueue, getAudioStatus } from './audio.js';\n""",
          """import { cancelMessageAudio, cancelQueuedAskAudioForUser, cancelUserAudio, enqueue, getAudioStatus } from './audio.js';\n""")

          replace('src/commands.js',
          """  enqueue,\n  cancel: cancelMessageAudio\n};\n""",
          """  enqueue,\n  cancel: cancelMessageAudio,\n  cancelQueuedAsk: cancelQueuedAskAudioForUser\n};\n""")

          replace('src/commands.js',
          """            `First-audio budget ${settings.geminiLive?.firstAudioBudgetMs}ms • windows ${settings.providerHealth?.primaryFirstAudioMs}/${settings.providerHealth?.fallbackFirstAudioMs}/${settings.providerHealth?.exactFirstAudioMs}ms • /ask 3.1 buffered ≤${provider.askExactBufferedTimeoutMs}ms • fresh Google ≤${settings.googleTts?.timeoutMs}ms`,\n""",
          """            `First-audio budget ${settings.geminiLive?.firstAudioBudgetMs}ms • windows ${settings.providerHealth?.primaryFirstAudioMs}/${settings.providerHealth?.fallbackFirstAudioMs}/${settings.providerHealth?.exactFirstAudioMs}ms • /ask 3.1 stream first ≤${settings.geminiTts?.timeoutMs}ms • stall ≤${settings.geminiTts?.streamIdleTimeoutMs}ms • fresh Google ≤${settings.googleTts?.timeoutMs}ms`,\n""")

          replace('test/ask-literal-tts.test.js',
          """  assert.equal(item.metadata.skipLive, true);\n  assert.equal(item.metadata.forceBuffered, true);\n  assert.equal(item.metadata.messageId, 'ask:interaction-literal');\n""",
          """  assert.equal(item.metadata.skipLive, true);\n  assert.equal(item.metadata.forceBuffered, false);\n  assert.equal(item.metadata.noPrefetch, true);\n  assert.equal(item.metadata.messageId, 'ask:interaction-literal');\n""")

          replace('test/ask-buffered-tts-watchdog.test.js',
          """test('/ask exact TTS uses bounded completed-response mode while normal exact fallback stays streaming', () => {\n  assert.equal(tts.__test.isBufferedExactContext({ skipLive: true, liveStreamOutput: false }), true);\n  assert.equal(tts.__test.exactAttemptWindowMs({ skipLive: true, liveStreamOutput: false }), 10000);\n  assert.equal(tts.__test.exactAttemptWindowMs({ skipLive: true, liveStreamOutput: true }), 4000);\n  const buffered = tts.__test.exactOptions(null, 10000, 'fixture-key', { skipLive: true, liveStreamOutput: false });\n  const normal = tts.__test.exactOptions(null, 1600, 'fixture-key', {});\n  assert.equal(buffered.streaming, false);\n  assert.equal(buffered.bufferedTimeoutMs, 10000);\n  assert.equal(normal.streaming, true);\n  assert.equal(normal.bufferedTimeoutMs, undefined);\n});\n""",
          """test('/ask exact TTS uses the streaming first-audio path while explicit buffered mode remains available for recovery', () => {\n  assert.equal(tts.__test.isBufferedExactContext({ skipLive: true }), false);\n  assert.equal(tts.__test.exactAttemptWindowMs({ skipLive: true }), 4000);\n  const askStreaming = tts.__test.exactOptions(null, 4000, 'fixture-key', { skipLive: true });\n  const explicitBuffered = tts.__test.exactOptions(null, 10000, 'fixture-key', { skipLive: true, liveStreamOutput: false });\n  const normal = tts.__test.exactOptions(null, 1600, 'fixture-key', {});\n  assert.equal(askStreaming.streaming, true);\n  assert.equal(askStreaming.bufferedTimeoutMs, undefined);\n  assert.equal(explicitBuffered.streaming, false);\n  assert.equal(explicitBuffered.bufferedTimeoutMs, 10000);\n  assert.equal(normal.streaming, true);\n});\n""")

          Path('test/ask-queue-latency.test.js').write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\n\nprocess.env.DISCORD_TOKEN ||= 'test-token';\nprocess.env.DISCORD_CLIENT_ID ||= '123456789012345678';\nprocess.env.DISCORD_GUILD_ID ||= '123456789012345678';\nconst { __test } = await import('../src/audio.js');\n\ntest('queued /ask items form a prefetch barrier', () => {\n  const ask = __test.createQueueItem('answer', { messageId: 'ask:one', userId: 'u1', noPrefetch: true });\n  const normal = __test.createQueueItem('normal', { messageId: 'msg:two', userId: 'u2' });\n  assert.equal(ask.noPrefetch, true);\n  assert.equal(__test.hasPrefetchBarrier([ask, normal]), true);\n  ask.generation = Promise.resolve({});\n  assert.equal(__test.hasPrefetchBarrier([ask, normal]), false);\n});\n\ntest('a newer /ask cancels only older queued /ask speech from the same user', () => {\n  const oldAsk = __test.createQueueItem('old answer', { messageId: 'ask:old', userId: 'u1', noPrefetch: true });\n  const normal = __test.createQueueItem('normal chat', { messageId: 'normal:1', userId: 'u1' });\n  const otherAsk = __test.createQueueItem('other answer', { messageId: 'ask:other', userId: 'u2', noPrefetch: true });\n  const state = { queue: [oldAsk, normal, otherAsk] };\n  assert.equal(__test.cancelQueuedAskItemsForUser(state, 'u1'), 1);\n  assert.equal(oldAsk.cancelled, true);\n  assert.deepEqual(state.queue.map((item) => item.messageId), ['normal:1', 'ask:other']);\n});\n""", encoding='utf-8')

          # This workflow is a one-shot patch vehicle; do not leave it in the PR.
          Path('.github/workflows/temp-patch-ask-streaming.yml').unlink()
      - name: Validate
        run: |
          npm ci
          node --check src/ask-response.js
          node --check src/audio.js
          node --check src/commands.js
          node --test
          npm audit --audit-level=high
      - name: Commit patch
        run: |
          git config user.name "MrEz"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git add -A
          git commit -m "Reduce /ask TTS latency and queue buildup"
          git push origin HEAD:fix/ask-streaming-latency-queue
