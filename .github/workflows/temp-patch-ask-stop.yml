name: Prepare ask stop cancellation hardening
on:
  push:
    branches:
      - fix/ask-stop-cancel-barrier
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ask-stop-cancel-barrier
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace('src/tts.js',
          """    if (releaseGemini) {\n      const release = releaseGemini;\n      releaseOwnedByCompletion = true;\n      Promise.resolve(generated?.completion).finally(release).catch(() => {});\n    }\n""",
          """    if (releaseGemini) {\n      const release = releaseGemini;\n      releaseOwnedByCompletion = true;\n      // Explicit queue/user cancellation must release local Gemini ownership\n      // immediately. Waiting for a remote streaming body to notice abort can\n      // otherwise make the next TTS inherit a stale busy limiter/probe state.\n      // release() is idempotent, so normal completion can safely call it again.\n      let parentCancelRelease = null;\n      if (parentSignal) {\n        parentCancelRelease = () => {\n          release();\n          releaseHalfOpenProbe(key, state);\n        };\n        if (parentSignal.aborted) parentCancelRelease();\n        else parentSignal.addEventListener('abort', parentCancelRelease, { once: true });\n      }\n      Promise.resolve(generated?.completion).finally(() => {\n        if (parentSignal && parentCancelRelease) parentSignal.removeEventListener?.('abort', parentCancelRelease);\n        release();\n      }).catch(() => {});\n    }\n""")

          replace('src/providers/gemini.js',
          """  const output = new PassThrough({ highWaterMark: 96 * 1024 });\n  // Completion is the canonical failure channel. Prevent an expected provider\n  // stream failure from becoming an uncaught EventEmitter error before FFmpeg\n  // attaches as the consumer.\n  output.on('error', () => {});\n  const mirror = [];\n""",
          """  const output = new PassThrough({ highWaterMark: 96 * 1024 });\n  // Completion is the canonical failure channel. Prevent an expected provider\n  // stream failure from becoming an uncaught EventEmitter error before FFmpeg\n  // attaches as the consumer.\n  output.on('error', () => {});\n  // STOP must deterministically wake a pending body read instead of relying only\n  // on fetch AbortSignal propagation. This keeps a cancelled /ask stream from\n  // lingering behind the next TTS request.\n  const forceAbortBody = () => {\n    const reason = linked.controller.signal.reason instanceof Error\n      ? linked.controller.signal.reason\n      : cancellationError(linked.controller.signal.reason);\n    try { void reader.cancel(reason).catch(() => {}); } catch {}\n    try { if (!output.destroyed) output.destroy(reason); } catch {}\n  };\n  if (linked.controller.signal.aborted) forceAbortBody();\n  else linked.controller.signal.addEventListener('abort', forceAbortBody, { once: true });\n  const mirror = [];\n""")

          replace('src/providers/gemini.js',
          """    } finally {\n      if (idleTimer) clearTimeout(idleTimer);\n      clearFirstTimer();\n      linked.cleanup();\n    }\n""",
          """    } finally {\n      if (idleTimer) clearTimeout(idleTimer);\n      clearFirstTimer();\n      linked.controller.signal.removeEventListener?.('abort', forceAbortBody);\n      linked.cleanup();\n    }\n""")

          test = Path('test/ask-buffered-tts-watchdog.test.js')
          text = test.read_text(encoding='utf-8')
          if 'explicit cancellation directly cancels the Gemini TTS response body' in text:
              raise SystemExit('tests already patched')
          lines = [
              '',
              "test('explicit cancellation directly cancels the Gemini TTS response body', async () => {",
              '  let bodyCancelled = false;',
              '  const fetchImpl = async () => new Response(new ReadableStream({',
              '    start(controller) {',
              "      controller.enqueue(sse({ event_type: 'step.start', index: 0, step: { type: 'model_output' } }));",
              '      controller.enqueue(sse(audioDelta(0)));',
              '    },',
              '    cancel() { bodyCancelled = true; }',
              "  }), { status: 200, headers: { 'content-type': 'text/event-stream' } });",
              '',
              "  const generated = await synthesizeGemini('berhenti sekarang', 'Charon', {",
              "    apiKey: 'fixture-key', fetchImpl, timeoutMs: 1000, streamIdleTimeoutMs: 5000, maxOutputAudioMs: 5000",
              '  });',
              "  const reason = new Error('STOP TTS');",
              '  reason.cancelled = true;',
              '  generated.cancel(reason);',
              '  await assert.rejects(generated.completion, /STOP TTS/i);',
              '  assert.equal(bodyCancelled, true);',
              '});',
              '',
              "test('parent cancellation releases Gemini limiter ownership before remote completion settles', async () => {",
              '  tts.restartTtsRuntime();',
              '  const parent = new AbortController();',
              '  const never = new Promise(() => {});',
              '  const attempts = [];',
              '  const attempt = await tts.__test.runAttempt({',
              "    key: 'exactTts', providerName: 'fixture-gemini-tts', windowMs: 1000,",
              '    parentSignal: parent.signal, attempts,',
              '    factory: async () => ({ completion: never }), options: {}, geminiProvider: true',
              '  });',
              '  assert.ok(attempt.result);',
              '  assert.equal(tts.getTtsProviderStatus().geminiLimiter.active, 1);',
              "  const reason = new Error('STOP TTS');",
              '  reason.cancelled = true;',
              '  parent.abort(reason);',
              '  await new Promise((resolve) => setImmediate(resolve));',
              '  assert.equal(tts.getTtsProviderStatus().geminiLimiter.active, 0);',
              '  tts.restartTtsRuntime();',
              '});',
              ''
          ]
          test.write_text(text + '\n'.join(lines), encoding='utf-8')

          Path('.github/workflows/temp-patch-ask-stop.yml').unlink()
      - name: Validate
        run: |
          npm ci
          node --check src/tts.js
          node --check src/providers/gemini.js
          node --test
          npm audit --audit-level=high
      - name: Commit patch
        run: |
          git config user.name "MrEz"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git add -A
          git commit -m "Harden /ask STOP cancellation teardown"
          git push origin HEAD:fix/ask-stop-cancel-barrier
