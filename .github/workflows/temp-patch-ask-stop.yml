name: Prepare ask stop cancellation hardening
on:
  push:
    branches:
      - fix/ask-stop-cancel-barrier
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ask-stop-cancel-barrier
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path
          tts = Path('src/tts.js')
          s = tts.read_text(encoding='utf-8')
          old = """    if (releaseGemini) {
      const release = releaseGemini;
      releaseOwnedByCompletion = true;
      Promise.resolve(generated?.completion).finally(release).catch(() => {});
    }
"""
          new = """    if (releaseGemini) {
      const release = releaseGemini;
      releaseOwnedByCompletion = true;
      // Explicit queue/user cancellation must release local Gemini ownership
      // immediately. Waiting for a remote streaming body to notice abort can
      // otherwise make the next TTS inherit a stale busy limiter/probe state.
      // release() is idempotent, so normal completion can safely call it again.
      let parentCancelRelease = null;
      if (parentSignal) {
        parentCancelRelease = () => {
          release();
          releaseHalfOpenProbe(key, state);
        };
        if (parentSignal.aborted) parentCancelRelease();
        else parentSignal.addEventListener('abort', parentCancelRelease, { once: true });
      }
      Promise.resolve(generated?.completion).finally(() => {
        if (parentSignal && parentCancelRelease) parentSignal.removeEventListener?.('abort', parentCancelRelease);
        release();
      }).catch(() => {});
    }
"""
          if old not in s:
              raise SystemExit('tts release anchor not found')
          tts.write_text(s.replace(old, new, 1), encoding='utf-8')

          provider = Path('src/providers/gemini.js')
          s = provider.read_text(encoding='utf-8')
          old = """  const output = new PassThrough({ highWaterMark: 96 * 1024 });
  // Completion is the canonical failure channel. Prevent an expected provider
  // stream failure from becoming an uncaught EventEmitter error before FFmpeg
  // attaches as the consumer.
  output.on('error', () => {});
  const mirror = [];
"""
          new = """  const output = new PassThrough({ highWaterMark: 96 * 1024 });
  // Completion is the canonical failure channel. Prevent an expected provider
  // stream failure from becoming an uncaught EventEmitter error before FFmpeg
  // attaches as the consumer.
  output.on('error', () => {});
  // fetch AbortSignal propagation is normally enough to wake reader.read(), but
  // an explicit STOP must be deterministic. Directly cancel the response-body
  // reader and destroy the provider output whenever the linked request aborts.
  // This prevents a cancelled /ask stream lingering behind the next TTS.
  const forceAbortBody = () => {
    const reason = linked.controller.signal.reason instanceof Error
      ? linked.controller.signal.reason
      : cancellationError(linked.controller.signal.reason);
    try { void reader.cancel(reason).catch(() => {}); } catch {}
    try { if (!output.destroyed) output.destroy(reason); } catch {}
  };
  if (linked.controller.signal.aborted) forceAbortBody();
  else linked.controller.signal.addEventListener('abort', forceAbortBody, { once: true });
  const mirror = [];
"""
          if old not in s:
              raise SystemExit('provider output anchor not found')
          s = s.replace(old, new, 1)
          old = """    } finally {
      if (idleTimer) clearTimeout(idleTimer);
      clearFirstTimer();
      linked.cleanup();
    }
"""
          new = """    } finally {
      if (idleTimer) clearTimeout(idleTimer);
      clearFirstTimer();
      linked.controller.signal.removeEventListener?.('abort', forceAbortBody);
      linked.cleanup();
    }
"""
          if old not in s:
              raise SystemExit('provider finally anchor not found')
          provider.write_text(s.replace(old, new, 1), encoding='utf-8')

          test = Path('test/ask-buffered-tts-watchdog.test.js')
          s = test.read_text(encoding='utf-8')
          addition = r'''

test('explicit cancellation directly cancels the Gemini TTS response body', async () => {
  let bodyCancelled = false;
  const fetchImpl = async () => new Response(new ReadableStream({
    start(controller) {
      controller.enqueue(sse({ event_type: 'step.start', index: 0, step: { type: 'model_output' } }));
      controller.enqueue(sse(audioDelta(0)));
    },
    cancel() { bodyCancelled = true; }
  }), { status: 200, headers: { 'content-type': 'text/event-stream' } });

  const generated = await synthesizeGemini('berhenti sekarang', 'Charon', {
    apiKey: 'fixture-key', fetchImpl, timeoutMs: 1000, streamIdleTimeoutMs: 5000, maxOutputAudioMs: 5000
  });
  const reason = new Error('STOP TTS');
  reason.cancelled = true;
  generated.cancel(reason);
  await assert.rejects(generated.completion, /STOP TTS/i);
  assert.equal(bodyCancelled, true);
});

test('parent cancellation releases Gemini limiter ownership before remote completion settles', async () => {
  tts.restartTtsRuntime();
  const parent = new AbortController();
  const never = new Promise(() => {});
  const attempts = [];
  const attempt = await tts.__test.runAttempt({
    key: 'exactTts', providerName: 'fixture-gemini-tts', windowMs: 1000,
    parentSignal: parent.signal, attempts,
    factory: async () => ({ completion: never }), options: {}, geminiProvider: true
  });
  assert.ok(attempt.result);
  assert.equal(tts.getTtsProviderStatus().geminiLimiter.active, 1);
  const reason = new Error('STOP TTS');
  reason.cancelled = true;
  parent.abort(reason);
  await new Promise((resolve) => setImmediate(resolve));
  assert.equal(tts.getTtsProviderStatus().geminiLimiter.active, 0);
  tts.restartTtsRuntime();
});
'''
          if "explicit cancellation directly cancels the Gemini TTS response body" in s:
              raise SystemExit('tests already patched')
          test.write_text(s + addition, encoding='utf-8')
          Path('.github/workflows/temp-patch-ask-stop.yml').unlink()
      - name: Validate
        run: |
          npm ci
          node --check src/tts.js
          node --check src/providers/gemini.js
          node --test
          npm audit --audit-level=high
      - name: Commit patch
        run: |
          git config user.name "MrEz"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git add -A
          git commit -m "Harden /ask STOP cancellation teardown"
          git push origin HEAD:fix/ask-stop-cancel-barrier
