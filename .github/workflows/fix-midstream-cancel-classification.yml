name: Fix midstream cancellation classification

on:
  push:
    branches:
      - fix/runaway-isolation-v3

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runaway-isolation-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch classifier and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/tts.js')
          text = p.read_text(encoding='utf-8')
          old = '''  return !error?.dailyQuotaLike\n    && !error?.quotaLike\n    && !error?.authLike\n    && !error?.permissionLike\n    && !error?.configLike;'''
          new = '''  return !error?.cancelled\n    && !error?.budgetLike\n    && !error?.dailyQuotaLike\n    && !error?.quotaLike\n    && !error?.authLike\n    && !error?.permissionLike\n    && !error?.configLike;'''
          if text.count(old) != 1:
              raise SystemExit(f'classifier match count {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('test/runaway-isolation.test.js')
          text = p.read_text(encoding='utf-8')
          old = """  assert.equal(tts.__test.shouldIsolateLiveMidstreamFailure({ quotaLike: true }, 'livePrimary'), false);\n  assert.equal(tts.__test.shouldIsolateLiveMidstreamFailure({ authLike: true }, 'livePrimary'), false);"""
          new = """  assert.equal(tts.__test.shouldIsolateLiveMidstreamFailure({ cancelled: true }, 'livePrimary'), false);\n  assert.equal(tts.__test.shouldIsolateLiveMidstreamFailure({ budgetLike: true }, 'livePrimary'), false);\n  assert.equal(tts.__test.shouldIsolateLiveMidstreamFailure({ quotaLike: true }, 'livePrimary'), false);\n  assert.equal(tts.__test.shouldIsolateLiveMidstreamFailure({ authLike: true }, 'livePrimary'), false);"""
          if text.count(old) != 1:
              raise SystemExit(f'test match count {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - run: npm ci
      - run: node --check src/tts.js && node --check test/runaway-isolation.test.js
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tts.js test/runaway-isolation.test.js
          git commit -m "Keep Live cancellations health-neutral"
          git push origin HEAD:fix/runaway-isolation-v3
