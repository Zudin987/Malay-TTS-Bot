name: Apply v0.23.5 Audit Follow-up

on:
  push:
    branches: ['audit/v0.23.5']
    paths:
      - '.github/workflows/apply-audit-followup.yml'
      - 'audit-v0235-followup.patch'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/v0.23.5
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Apply tested source follow-up
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          store = Path('src/store.js')
          text = store.read_text()
          anchor = "function normalizeGuild(raw = {}) {"
          helper = """function updateOptOutIds(currentIds, userId, enabled) {
            const key = String(userId ?? '').trim();
            const ids = new Set(cleanIdList(currentIds, Number.POSITIVE_INFINITY));
            if (enabled) ids.add(key);
            else ids.delete(key);
            return cleanIdList([...ids], Number.POSITIVE_INFINITY);
          }

          """
          if 'function updateOptOutIds(' not in text:
              if text.count(anchor) != 1: raise SystemExit('normalizeGuild anchor mismatch')
              text = text.replace(anchor, helper + anchor)
          old_setter = """  const key = String(userId);
            const ids = new Set(current.ttsOptOutUserIds);
            if (enabled) ids.add(key);
            else ids.delete(key);
            current.ttsOptOutUserIds = cleanIdList([...ids]);"""
          new_setter = "  current.ttsOptOutUserIds = updateOptOutIds(current.ttsOptOutUserIds, userId, enabled);"
          if old_setter in text:
              text = text.replace(old_setter, new_setter, 1)
          if "export const __test = { normalizeGuild, normalizeGuildCollection };" in text:
              text = text.replace(
                  "export const __test = { normalizeGuild, normalizeGuildCollection };",
                  "export const __test = { normalizeGuild, normalizeGuildCollection, updateOptOutIds };",
                  1,
              )
          if new_setter not in text or 'updateOptOutIds };' not in text:
              raise SystemExit('store edit verification failed')
          store.write_text(text)

          privacy_test = Path('test/privacy-optout.test.js')
          privacy_test.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';

          process.env.DISCORD_TOKEN ||= 'test-token';
          process.env.DISCORD_CLIENT_ID ||= '123456789012345678';
          const { __test: storeTest } = await import('../src/store.js');

          test('privacy opt-out mutation never silently drops users after the old 500-entry cap', () => {
            const ids = Array.from({ length: 650 }, (_, index) => String(10000 + index));
            const added = '999999999999999999';
            const enabled = storeTest.updateOptOutIds(ids, added, true);
            assert.equal(enabled.length, 651);
            assert.equal(enabled.includes(added), true);
            assert.equal(enabled.includes(ids[0]), true);

            const disabled = storeTest.updateOptOutIds(enabled, ids[0], false);
            assert.equal(disabled.length, 650);
            assert.equal(disabled.includes(ids[0]), false);
            assert.equal(disabled.includes(added), true);
          });
          """)

          maintenance = Path('MAINTENANCE.md')
          text = maintenance.read_text().replace(
              'Current imported baseline: **v0.23.3 — Adaptive Quota Failover / 4 Voices**.',
              'Current stable baseline: **v0.23.4 — Audit Hardening**.',
          )
          maintenance.write_text(text)
          PY
          rm -f audit-v0235-followup.patch .github/workflows/apply-audit-followup.yml

      - name: Install dependencies
        run: npm ci

      - name: Validate source and JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
          node -e "const fs=require('fs'),p=require('path'); const files=['package.json','package-lock.json',...fs.readdirSync('config').filter(x=>x.endsWith('.json')).map(x=>p.join('config',x))]; for(const f of files) JSON.parse(fs.readFileSync(f,'utf8')); console.log('Validated '+files.length+' JSON file(s).')"
          git diff --check

      - name: Regression tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Release hygiene guard
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e data/guilds.json
          test ! -e data/speaker-label-cache
          test ! -e runtime
          test ! -e bot.log
          test ! -e bot-old.log
          test ! -e audit-v0235-followup.patch

      - name: Commit source follow-up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete opt-out persistence hardening'
          git push origin HEAD:audit/v0.23.5
