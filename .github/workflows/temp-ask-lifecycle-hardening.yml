name: Temporary ask lifecycle hardening

on:
  push:
    branches:
      - fix/ask-lifecycle-hardening
    paths:
      - .github/workflows/temp-ask-lifecycle-hardening.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/ask-lifecycle-hardening
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Apply focused patch
        run: |
          python3 .github/scripts/patch_ask_lifecycle.py
          python3 .github/scripts/patch_ask_lifecycle_test.py

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src test -type f -name '*.js' -print0)

      - name: Regression tests
        run: npm test

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: Commit focused changes and remove temporary patch tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Zudin987"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git rm .github/scripts/patch_ask_lifecycle.py .github/scripts/patch_ask_lifecycle_test.py .github/workflows/temp-ask-lifecycle-hardening.yml
          git add src/tts.js src/audio.js src/ask-response.js src/commands.js test/ask-command.test.js test/ask-lifecycle-hardening.test.js
          git commit -m "Harden /ask ordering cancellation and queue lifecycle"
          git push origin HEAD:fix/ask-lifecycle-hardening
