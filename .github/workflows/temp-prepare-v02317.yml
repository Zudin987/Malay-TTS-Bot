name: Prepare v0.23.17

on:
  push:
    branches:
      - release/v0.23.17-six-voices

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.23.17-six-voices
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepare release metadata and validate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          npm version 0.23.17 --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $pkgPath = 'package.json'
          $pkg = Get-Content $pkgPath -Raw
          if (-not $pkg.Contains('four curated voices')) { throw 'Expected old package description not found.' }
          $pkg = $pkg.Replace('four curated voices', 'six curated voices')
          Set-Content -LiteralPath $pkgPath -Value $pkg -NoNewline -Encoding utf8

          $setupPath = 'setup-clean.cmd'
          $setup = Get-Content $setupPath -Raw
          if (-not $setup.Contains('clean setup v0.23.16')) { throw 'Expected old setup banner not found.' }
          $setup = $setup.Replace('clean setup v0.23.16', 'clean setup v0.23.17')
          Set-Content -LiteralPath $setupPath -Value $setup -NoNewline -Encoding utf8

          $maintenancePath = 'MAINTENANCE.md'
          $maintenance = Get-Content $maintenancePath -Raw
          $oldBaseline = 'Current stable baseline: **v0.23.13 — Concise /ask Chat**.'
          $newBaseline = 'Current stable baseline: **v0.23.17 — Six-Voice Pool**.'
          if (-not $maintenance.Contains($oldBaseline)) { throw 'Expected old maintenance baseline not found.' }
          $maintenance = $maintenance.Replace($oldBaseline, $newBaseline)
          $nl = if ($maintenance.Contains("`r`n")) { "`r`n" } else { "`n" }
          $oldVoices = @('- Charon','- Enceladus','- Aoede','- Despina') -join $nl
          $newVoices = @('- Charon — Male · Informative','- Orus — Male · Firm','- Schedar — Male · Even','- Gacrux — Female · Mature','- Vindemiatrix — Female · Gentle','- Despina — Female · Smooth') -join $nl
          if (-not $maintenance.Contains($oldVoices)) { throw 'Expected old maintenance voice pool not found.' }
          $maintenance = $maintenance.Replace($oldVoices, $newVoices)
          Set-Content -LiteralPath $maintenancePath -Value $maintenance -NoNewline -Encoding utf8

          @'
          Malay TTS Bot v0.23.17

          Changes
          - Replaces the four-voice Gemini pool with six selected voices: Charon, Orus, Schedar, Gacrux, Vindemiatrix, and Despina.
          - /changevoice now exposes those six voices with their style labels: informative, firm, even, mature, gentle, and smooth.
          - Existing Charon and Despina assignments remain valid. Saved Enceladus or Aoede assignments are automatically reassigned by the existing least-used current-voice logic.
          - Keeps provider order, round-robin API-key rotation, queue/fallback logic, /ask STOP TTS, latency settings, and strict lexical read-aloud behavior unchanged.

          Why
          Expand the curated voice selection while preserving the existing TTS architecture, latency behavior, and no-extra-words fidelity rules.
          '@ | Set-Content -LiteralPath 'RELEASE-v0.23.17.txt' -Encoding utf8

          if ((node -p "require('./package.json').version").Trim() -ne '0.23.17') { throw 'package.json version mismatch.' }
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($lock.version -ne '0.23.17' -or $lock.packages[''].version -ne '0.23.17') { throw 'package-lock version mismatch.' }
          if (-not (Select-String -Path setup-clean.cmd -SimpleMatch 'clean setup v0.23.17')) { throw 'setup-clean banner mismatch.' }
          if (-not (Test-Path RELEASE-v0.23.17.txt)) { throw 'Release note missing.' }

          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Remove-Item '.github/workflows/temp-prepare-v02317.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json setup-clean.cmd MAINTENANCE.md RELEASE-v0.23.17.txt .github/workflows/temp-prepare-v02317.yml
          git commit -m 'Prepare v0.23.17 six-voice release'
          git push origin HEAD:release/v0.23.17-six-voices
