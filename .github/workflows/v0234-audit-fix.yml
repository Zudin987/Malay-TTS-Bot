name: Apply v0.23.4 Audit Hardening

on:
  push:
    branches: [fix/v0.23.4-audit-hardening]
    paths:
      - '.github/workflows/v0234-audit-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.23.4-audit-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply audited source fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Gemini Live: preserve all classification flags through cancellation.
          replace_once(
              'src/providers/gemini-live.js',
              "for (const key of ['name', 'budgetLike', 'quotaLike', 'authLike', 'retryable', 'runawayLike']) {",
              "for (const key of ['name', 'budgetLike', 'quotaLike', 'dailyQuotaLike', 'authLike', 'permissionLike', 'configLike', 'retryable', 'runawayLike']) {"
          )

          # 2) Gemini Live: adaptive missing-metadata audio-end fallback.
          replace_once(
              'src/providers/gemini-live.js',
              "  let audioEndTimer = null;\n  let audioOutputEnded = false;\n  let messageQueue = Promise.resolve();",
              "  let audioEndTimer = null;\n  let audioOutputEnded = false;\n  let lastAudioChunkAt = 0;\n  let maximumObservedAudioGapMs = 0;\n  let audioChunkCount = 0;\n  let messageQueue = Promise.resolve();"
          )
          replace_once(
              'src/providers/gemini-live.js',
              "  const armAudioEndGrace = () => {\n    if (!streamOutput || audioOutputEnded || settled || !seenAudio) return;\n    clearAudioEndTimer();\n    audioEndTimer = setTimeout(() => endAudioOutput(), audioEndGraceMs);\n    audioEndTimer.unref?.();\n  };",
              "  const effectiveAudioEndGraceMs = () => {\n    // The grace timer is only a fallback for rare turns where Gemini omits or\n    // delays generationComplete/turnComplete. A fixed 650 ms gap can clip a\n    // healthy next audio event during network jitter. Protect the first gap\n    // for at least 900 ms, then adapt to observed cadence, capped at 1200 ms\n    // unless the operator explicitly configured a larger base grace.\n    if (audioChunkCount <= 1) return Math.max(audioEndGraceMs, 900);\n    const observed = maximumObservedAudioGapMs > 0\n      ? Math.ceil(maximumObservedAudioGapMs * 1.35 + 120)\n      : audioEndGraceMs;\n    return Math.max(audioEndGraceMs, Math.min(1200, observed));\n  };\n  const armAudioEndGrace = () => {\n    if (!streamOutput || audioOutputEnded || settled || !seenAudio) return;\n    clearAudioEndTimer();\n    const graceMs = effectiveAudioEndGraceMs();\n    audioEndTimer = setTimeout(() => endAudioOutput(), graceMs);\n    audioEndTimer.unref?.();\n  };"
          )
          replace_once(
              'src/providers/gemini-live.js',
              "          seenAudio = true;\n          audioBytes += audio.length;",
              "          const chunkAt = Date.now();\n          if (lastAudioChunkAt > 0) maximumObservedAudioGapMs = Math.max(maximumObservedAudioGapMs, chunkAt - lastAudioChunkAt);\n          lastAudioChunkAt = chunkAt;\n          audioChunkCount += 1;\n          seenAudio = true;\n          audioBytes += audio.length;"
          )

          # 3) Exact Gemini TTS: classify HTTP-200 SSE error events like HTTP errors.
          replace_once(
              'src/providers/gemini.js',
              "export class GeminiTtsHttpError extends Error {\n  constructor(status, apiStatus = null, message = '') {\n    const detail = String(message || '').trim();\n    super(`Gemini TTS returned HTTP ${status}${apiStatus ? ` (${apiStatus})` : ''}${detail ? `: ${detail}` : '.'}`);\n    this.name = 'GeminiTtsHttpError';\n    this.status = status;\n    this.apiStatus = apiStatus;\n    this.apiMessage = detail;\n    const haystack = `${apiStatus || ''} ${detail}`;\n    this.retryable = status === 408 || status === 429 || status >= 500;\n    this.quotaLike = status === 429 || apiStatus === 'RESOURCE_EXHAUSTED' || /quota|rate.?limit|too many requests/iu.test(haystack);\n    this.dailyQuotaLike = this.quotaLike && /requests?\\s*per\\s*day|\\brpd\\b|daily|per\\s+day|day\\s+quota/iu.test(haystack);\n    // Only clear credential failures disable every Gemini provider. A generic\n    // 403/PERMISSION_DENIED may be model/project access specific.\n    this.authLike = status === 401 || apiStatus === 'UNAUTHENTICATED' || /api.?key.{0,50}(invalid|expired|revoked|disabled)|invalid.{0,30}api.?key/iu.test(haystack);\n    this.permissionLike = status === 403 || apiStatus === 'PERMISSION_DENIED';\n    this.configLike = status === 400 || apiStatus === 'INVALID_ARGUMENT';\n    this.transportLike = status >= 500;\n    this.setupLike = true;\n  }\n}",
              "export class GeminiTtsHttpError extends Error {\n  constructor(status, apiStatus = null, message = '') {\n    const detail = String(message || '').trim();\n    super(`Gemini TTS returned HTTP ${status}${apiStatus ? ` (${apiStatus})` : ''}${detail ? `: ${detail}` : '.'}`);\n    this.name = 'GeminiTtsHttpError';\n    this.status = status;\n    this.apiStatus = apiStatus;\n    this.apiMessage = detail;\n    const haystack = `${apiStatus || ''} ${detail}`;\n    this.retryable = status === 408 || status === 429 || status >= 500;\n    this.quotaLike = status === 429 || apiStatus === 'RESOURCE_EXHAUSTED' || /quota|rate.?limit|too many requests/iu.test(haystack);\n    this.dailyQuotaLike = this.quotaLike && /requests?\\s*per\\s*day|\\brpd\\b|daily|per\\s+day|day\\s+quota/iu.test(haystack);\n    // Only clear credential failures disable every Gemini provider. A generic\n    // 403/PERMISSION_DENIED may be model/project access specific.\n    this.authLike = status === 401 || apiStatus === 'UNAUTHENTICATED' || /api.?key.{0,50}(invalid|expired|revoked|disabled)|invalid.{0,30}api.?key/iu.test(haystack);\n    this.permissionLike = status === 403 || apiStatus === 'PERMISSION_DENIED';\n    this.configLike = status === 400 || apiStatus === 'INVALID_ARGUMENT';\n    this.transportLike = status >= 500;\n    this.setupLike = true;\n  }\n}\n\nexport class GeminiTtsStreamError extends Error {\n  constructor(payload = {}, setupLike = false) {\n    const source = payload && typeof payload === 'object' ? payload : {};\n    const detail = String(source.message || source.detail || 'Gemini TTS streaming interaction failed.').trim();\n    const code = source.code ?? source.status_code ?? source.http_status ?? null;\n    const apiStatus = source.status ?? source.type ?? source.error_type ?? null;\n    super(detail);\n    this.name = 'GeminiTtsStreamError';\n    this.code = code;\n    this.status = code;\n    this.apiStatus = apiStatus;\n    this.apiMessage = detail;\n    const haystack = `${code ?? ''} ${apiStatus ?? ''} ${detail}`;\n    this.quotaLike = /\\b429\\b|resource[_ -]?exhausted|quota|rate.?limit|too many requests/iu.test(haystack);\n    this.dailyQuotaLike = this.quotaLike && /requests?\\s*per\\s*day|\\brpd\\b|daily|per\\s+day|day\\s+quota/iu.test(haystack);\n    this.authLike = /\\b401\\b|unauthenticated|authentication|api.?key.{0,50}(invalid|expired|revoked|disabled)|invalid.{0,30}api.?key/iu.test(haystack);\n    this.permissionLike = /\\b403\\b|permission[_ -]?denied|forbidden/iu.test(haystack);\n    this.configLike = /\\b400\\b|invalid[_ -]?argument|invalid[_ -]?request/iu.test(haystack);\n    this.retryable = this.quotaLike || /\\b408\\b|\\b429\\b|\\b5\\d\\d\\b|temporar|unavailable|overload|internal|server[_ -]?error/iu.test(haystack);\n    this.transportLike = /\\b5\\d\\d\\b|network|connection|transport/iu.test(haystack);\n    this.setupLike = Boolean(setupLike);\n  }\n}"
          )
          replace_once(
              'src/providers/gemini.js',
              "    for (const key of ['name', 'code', 'status', 'budgetLike', 'quotaLike', 'authLike', 'retryable', 'runawayLike', 'setupLike', 'transportLike']) {",
              "    for (const key of ['name', 'code', 'status', 'apiStatus', 'budgetLike', 'quotaLike', 'dailyQuotaLike', 'authLike', 'permissionLike', 'configLike', 'retryable', 'runawayLike', 'setupLike', 'transportLike']) {"
          )
          replace_once(
              'src/providers/gemini.js',
              "      if (event.event_type === 'interaction.failed' || event.event_type === 'error') {\n        const error = new Error(event.error?.message || event.message || 'Gemini TTS streaming interaction failed.');\n        error.name = 'GeminiTtsStreamError';\n        throw error;\n      }",
              "      if (event.event_type === 'interaction.failed' || event.event_type === 'error') {\n        const payload = event.error && typeof event.error === 'object'\n          ? event.error\n          : { message: event.message || 'Gemini TTS streaming interaction failed.', code: event.code, status: event.status, type: event.type };\n        throw new GeminiTtsStreamError(payload, !firstSettled);\n      }"
          )

          # 4) Recovery items must retain message cancellation and channel ownership metadata.
          replace_once(
              'src/audio.js',
              "    messageCreatedAt: item.messageCreatedAt, preprocessMs: item.preprocessMs, userId: item.userId,\n    voice: item.voice, speakerLabel: item.speakerLabel, speakerResetSeconds: item.speakerResetSeconds, googleText: item.googleText,",
              "    messageCreatedAt: item.messageCreatedAt, preprocessMs: item.preprocessMs, userId: item.userId,\n    messageId: item.messageId, voiceChannelId: item.voiceChannelId,\n    voice: item.voice, speakerLabel: item.speakerLabel, speakerResetSeconds: item.speakerResetSeconds, googleText: item.googleText,"
          )
          replace_once(
              'src/audio.js',
              "export const __test = { mp3DurationMs, decideSpeakerLabel, buildPcmTail, createQueueItem, cancelQueuedItemsForUser, cancelCurrentItemForUser, createPrefetchSpool, wireProviderToInput, scheduleCompletionGraceCancel, canRunQueue, takeNextItem, abandonUnclaimedGeneration };",
              "export const __test = { mp3DurationMs, decideSpeakerLabel, buildPcmTail, createQueueItem, cancelQueuedItemsForUser, cancelCurrentItemForUser, createPrefetchSpool, wireProviderToInput, scheduleRecovery, scheduleCompletionGraceCancel, canRunQueue, takeNextItem, abandonUnclaimedGeneration };"
          )

          # 5) Keep critical guild mutations synchronous, but debounce non-critical normalization/automatic voice assignment writes.
          replace_once(
              'src/store.js',
              "let guilds = {};\nlet lastValidText = null;",
              "let guilds = {};\nlet lastValidText = null;\nlet deferredSaveTimer = null;"
          )
          replace_once(
              'src/store.js',
              "function save() {\n  fs.mkdirSync(dataDir, { recursive: true });\n  lastValidText = writeJsonAtomicWithBackup(filePath, guilds, lastValidText);\n}\n",
              "function save() {\n  if (deferredSaveTimer) { clearTimeout(deferredSaveTimer); deferredSaveTimer = null; }\n  fs.mkdirSync(dataDir, { recursive: true });\n  lastValidText = writeJsonAtomicWithBackup(filePath, guilds, lastValidText);\n}\n\nfunction scheduleNoncriticalSave(delayMs = 150) {\n  if (deferredSaveTimer) return;\n  deferredSaveTimer = setTimeout(() => {\n    deferredSaveTimer = null;\n    try {\n      fs.mkdirSync(dataDir, { recursive: true });\n      lastValidText = writeJsonAtomicWithBackup(filePath, guilds, lastValidText);\n    } catch (error) {\n      console.error('[store] Deferred guilds.json save failed:', error.message);\n    }\n  }, Math.max(25, Math.min(Number(delayMs) || 150, 1000)));\n  deferredSaveTimer.unref?.();\n}\n"
          )
          replace_once(
              'src/store.js',
              "  if (changed) save();",
              "  if (changed) scheduleNoncriticalSave();"
          )
          # Only the automatic allocator is non-critical; explicit command/privacy mutations still call save().
          old = "  current.ttsVoices[key] = selected;\n  save();\n  return selected;"
          new = "  current.ttsVoices[key] = selected;\n  scheduleNoncriticalSave();\n  return selected;"
          replace_once('src/store.js', old, new)

          # 6) Cache FFmpeg resolution while still invalidating when FFMPEG_PATH changes.
          replace_once(
              'src/ffmpeg.js',
              "const rootDir = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');",
              "const rootDir = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');\nlet cachedPath = null;\nlet cachedConfiguredPath = null;"
          )
          replace_once(
              'src/ffmpeg.js',
              "export function getFfmpegPath() {\n  for (const candidate of candidatePaths()) {\n    try {\n      if (fs.statSync(candidate).isFile()) return candidate;\n    } catch {}\n  }\n  return 'ffmpeg';\n}\n\nexport const __test = { candidatePaths };",
              "export function getFfmpegPath() {\n  const configured = String(process.env.FFMPEG_PATH ?? '').trim();\n  if (cachedPath && cachedConfiguredPath === configured) return cachedPath;\n  for (const candidate of candidatePaths()) {\n    try {\n      if (fs.statSync(candidate).isFile()) {\n        cachedConfiguredPath = configured;\n        cachedPath = candidate;\n        return cachedPath;\n      }\n    } catch {}\n  }\n  cachedConfiguredPath = configured;\n  cachedPath = 'ffmpeg';\n  return cachedPath;\n}\n\nfunction resetFfmpegPathCache() { cachedPath = null; cachedConfiguredPath = null; }\n\nexport const __test = { candidatePaths, resetFfmpegPathCache };"
          )

          # 7) Speaker-label truncation must operate on grapheme clusters, not code points.
          replace_once(
              'src/speaker-label.js',
              "export function normalizeSpeakerLabelText(value) {\n  const cleaned = String(value ?? '').replace(/[\\u0000-\\u0008\\u000B\\u000C\\u000E-\\u001F\\u007F-\\u009F]/gu, ' ').replace(/[\\u200B-\\u200D\\u2060\\uFEFF]/gu, '').replace(/\\s+/gu, ' ').trim();\n  return Array.from(cleaned).slice(0, 80).join('');\n}",
              "export function normalizeSpeakerLabelText(value) {\n  const cleaned = String(value ?? '').replace(/[\\u0000-\\u0008\\u000B\\u000C\\u000E-\\u001F\\u007F-\\u009F]/gu, ' ').replace(/[\\u200B-\\u200D\\u2060\\uFEFF]/gu, '').replace(/\\s+/gu, ' ').trim();\n  if (typeof Intl?.Segmenter === 'function') {\n    return [...new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(cleaned)].slice(0, 80).map((entry) => entry.segment).join('');\n  }\n  return Array.from(cleaned).slice(0, 80).join('');\n}"
          )

          # Regression coverage for every correctness fix plus Windows-safe atomic JSON replacement.
          tests = Path('test/regression.test.js')
          text = tests.read_text(encoding='utf-8')
          marker = "\n// v0.23.4 audit-hardening regression coverage\n"
          if marker in text:
              raise SystemExit('v0.23.4 regression block already present')
          text += marker + r'''

test('Gemini Live tolerates a healthy 700ms inter-chunk gap without clipping', async () => {
  class FakeSocket {
    constructor() { this.readyState = 0; setTimeout(() => { this.readyState = 1; this.onopen?.(); }, 0); }
    send(payload) {
      const message = JSON.parse(payload);
      if (message.setup) {
        setTimeout(() => this.onmessage?.({ data: JSON.stringify({ setupComplete: {} }) }), 0);
        return;
      }
      if (message.realtimeInput) {
        const one = Buffer.alloc(1200, 1).toString('base64');
        const two = Buffer.alloc(1200, 2).toString('base64');
        setTimeout(() => this.onmessage?.({ data: JSON.stringify({ serverContent: { modelTurn: { parts: [{ inlineData: { data: one, mimeType: 'audio/pcm;rate=24000' } }] } } }) }), 10);
        setTimeout(() => this.onmessage?.({ data: JSON.stringify({ serverContent: { modelTurn: { parts: [{ inlineData: { data: two, mimeType: 'audio/pcm;rate=24000' } }] } } }) }), 710);
        setTimeout(() => this.onmessage?.({ data: JSON.stringify({ serverContent: { generationComplete: true } }) }), 730);
        setTimeout(() => this.onmessage?.({ data: JSON.stringify({ serverContent: { turnComplete: true } }) }), 750);
      }
    }
    close() { this.readyState = 3; }
  }
  const generated = await live.synthesizeGeminiLive('dua chunk dengan network jitter', 'Charon', {
    apiKey: 'test-key', webSocketFactory: () => new FakeSocket(), firstAudioTimeoutMs: 500,
    streamIdleTimeoutMs: 1600, audioEndGraceMs: 650, maxOutputAudioMs: 6000, retryCount: 0
  });
  let bytes = 0;
  for await (const chunk of generated.audioStream) bytes += Buffer.from(chunk).length;
  assert.equal(bytes, 2400);
  const info = await generated.completion;
  assert.equal(info.audioBytes, 2400);
});

test('Gemini exact TTS classifies HTTP-200 SSE RPD errors as daily quota', async () => {
  const encoder = new TextEncoder();
  let emitted = false;
  const fetchImpl = async () => ({
    ok: true,
    body: {
      getReader() {
        return {
          async read() {
            if (emitted) return { done: true, value: undefined };
            emitted = true;
            const event = { event_type: 'error', error: { code: 429, status: 'RESOURCE_EXHAUSTED', message: 'RPD quota exceeded for this model' } };
            return { done: false, value: encoder.encode(`data: ${JSON.stringify(event)}\n\n`) };
          },
          async cancel() {}
        };
      }
    }
  });
  await assert.rejects(
    gemini.synthesizeGemini('quota classification', 'Charon', { apiKey: 'test-key', fetchImpl, timeoutMs: 500, retryCount: 0 }),
    (error) => error?.quotaLike === true && error?.dailyQuotaLike === true && error?.configLike === false
  );
});

test('cutoff recovery preserves message and voice-channel ownership metadata', () => {
  const state = { disposed: false, queue: [], cutoffRecoveries: 0, mirrorReplays: 0 };
  const item = audio.__test.createQueueItem('recover me', {
    userId: '42', messageId: 'message-123', voiceChannelId: 'voice-456', recoveryAttempt: 0
  });
  const scheduled = audio.__test.scheduleRecovery('guild-test', state, item, new Error('pre-audible failure'), { fullRetry: true });
  assert.equal(scheduled, true);
  assert.equal(state.queue[0].messageId, 'message-123');
  assert.equal(state.queue[0].voiceChannelId, 'voice-456');
});

test('speaker labels truncate by grapheme cluster', () => {
  const family = '👨‍👩‍👧‍👦';
  const result = speaker.normalizeSpeakerLabelText(family.repeat(100));
  assert.equal(graphemeCount(result), 80);
  assert.equal(result, family.repeat(80));
});

test('atomic guild JSON replacement keeps both primary and backup valid', async () => {
  const fsPromises = await import('node:fs/promises');
  const os = await import('node:os');
  const path = await import('node:path');
  const safeJson = await import('../src/safe-json.js');
  const dir = await fsPromises.mkdtemp(path.join(os.tmpdir(), 'malay-tts-safe-json-'));
  const file = path.join(dir, 'guilds.json');
  try {
    let previous = safeJson.writeJsonAtomicWithBackup(file, { version: 1 });
    previous = safeJson.writeJsonAtomicWithBackup(file, { version: 2 }, previous);
    const primary = JSON.parse(await fsPromises.readFile(file, 'utf8'));
    const backup = JSON.parse(await fsPromises.readFile(`${file}.bak`, 'utf8'));
    assert.deepEqual(primary, { version: 2 });
    assert.deepEqual(backup, { version: 1 });
    assert.match(previous, /"version": 2/);
  } finally {
    await fsPromises.rm(dir, { recursive: true, force: true });
  }
});
'''
          tests.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax
        shell: bash
        run: |
          find src test -type f -name '*.js' -print0 | xargs -0 -n1 node --check

