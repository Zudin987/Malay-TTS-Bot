name: Apply v0.23.4 Audit Hardening

on:
  push:
    branches:
      - fix/v0.23.4-audit-hardening
    paths:
      - .github/workflows/v0234-audit-fix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.23.4-audit-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply audited source fixes
        run: |
          python3 .github/scripts/apply-v0234.py
          python3 .github/scripts/apply-v0234-followup.py

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax
        shell: bash
        run: find src test -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Regression tests
        run: npm test

      - name: Diff safety
        run: git diff --check

      - name: Commit audited fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src test
          git diff --cached --quiet && { echo 'No source changes'; exit 0; }
          git commit -m 'fix: harden TTS failover and recovery after audit'
          git push origin HEAD:fix/v0.23.4-audit-hardening
