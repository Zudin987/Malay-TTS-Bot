name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax
        shell: bash
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      - name: JSON validation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const roots = ['config', 'package.json', 'package-lock.json'];
          const files = [];
          for (const item of roots) {
            if (!fs.existsSync(item)) continue;
            const stat = fs.statSync(item);
            if (stat.isFile()) files.push(item);
            else {
              for (const name of fs.readdirSync(item)) {
                if (name.endsWith('.json')) files.push(path.join(item, name));
              }
            }
          }
          for (const file of files) JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log(`Validated ${files.length} JSON file(s).`);
          NODE

      - name: Regression tests
        run: npm test

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: FFmpeg/libopus probe
        shell: bash
        run: |
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i 'sine=frequency=440:duration=0.20' \
            -af 'volume=0.600,alimiter=limit=0.562341:attack=1.0:release=60.0:level=false' \
            -c:a libopus -f ogg -y /tmp/malay-tts-probe.ogg
          ffmpeg -hide_banner -loglevel error -i /tmp/malay-tts-probe.ogg -f null -

      - name: Secret/runtime file guard
        shell: bash
        run: |
          test ! -e .env
          test ! -e data/guilds.json
          test ! -d data/speaker-label-cache
          test ! -d runtime
          test ! -e bot.log
          test ! -e bot-old.log
