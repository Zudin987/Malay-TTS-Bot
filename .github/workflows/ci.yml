name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: validate
          - os: windows-latest
            name: windows-validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Five consecutive full regression passes
        run: node scripts/repeat-tests.mjs
      - name: Validate all source JavaScript, JSON and private-file exclusions
        run: node scripts/validate-source.mjs
      - name: Exercise real ZIP integrity and exclusion checks
        run: python scripts/test-clean-package.py
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Install Linux FFmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Linux FFmpeg/Opus round trip
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=0.20' -af 'volume=0.600,alimiter=limit=0.562341:attack=1.0:release=60.0:level=false' -c:a libopus -f ogg -y /tmp/malay-tts-probe.ogg
          ffmpeg -hide_banner -loglevel error -i /tmp/malay-tts-probe.ogg -f null -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-${{ runner.os }}-${{ github.sha }}
          path: artifacts/*.log
          retention-days: 14

  package-windows:
    name: clean-windows-package
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build from tracked source and checksum-pinned runtimes
        shell: pwsh
        run: python scripts/build-clean.py --archives "$env:RUNNER_TEMP/runtime-archives" --output dist --commit "$env:GITHUB_SHA"
      - name: Verify every ZIP member and re-extract the final CLEAN archive
        shell: pwsh
        run: |
          $Zip = (Get-ChildItem dist -Filter '*-CLEAN.zip').FullName
          python scripts/verify-clean.py $Zip --expected-commit "$env:GITHUB_SHA" --extract 'C:/'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test packaged runtime, SYSTEM lifecycle and full-tree ACLs
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -PackagePath 'C:\Malay-TTS-Bot'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clean-windows-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish-validated-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, package-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: clean-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: clean-windows-${{ github.sha }}
          path: dist
      - name: Recheck the exact validated package before publishing
        shell: bash
        run: python scripts/verify-clean.py dist/*-CLEAN.zip --expected-commit "$GITHUB_SHA"
      - name: Publish the new version after all Linux, Windows and package gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
