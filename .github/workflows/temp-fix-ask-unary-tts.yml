name: Prepare ask unary Gemini TTS fix

on:
  push:
    branches:
      - fix/ask-unary-gemini-tts

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ask-unary-gemini-tts
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply focused fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # Provider: add a completed-response (non-streaming) Interactions TTS path.
          gemini = read('src/providers/gemini.js')
          marker = 'async function startStreamingRequest(fetchImpl, text, voiceName, apiKey, options) {'
          if gemini.count(marker) != 1:
              raise SystemExit('gemini streaming function anchor mismatch')
          buffered_provider = r'''function extractBufferedAudio(interaction) {
            const direct = interaction?.output_audio ?? interaction?.outputAudio;
            if (direct?.data) return direct;

            const steps = Array.isArray(interaction?.steps) ? interaction.steps : [];
            for (let stepIndex = steps.length - 1; stepIndex >= 0; stepIndex -= 1) {
              const step = steps[stepIndex];
              if (step?.type !== 'model_output') continue;
              const content = Array.isArray(step.content) ? step.content : (step?.content ? [step.content] : []);
              for (let contentIndex = content.length - 1; contentIndex >= 0; contentIndex -= 1) {
                const item = content[contentIndex];
                if (item?.type === 'audio' && item?.data) return item;
              }
            }

            const outputs = Array.isArray(interaction?.outputs) ? interaction.outputs : [];
            for (let index = outputs.length - 1; index >= 0; index -= 1) {
              const item = outputs[index];
              if (item?.type === 'audio' && item?.data) return item;
            }
            return null;
          }

          async function startBufferedRequest(fetchImpl, text, voiceName, apiKey, options) {
            const model = String(options.model || DEFAULT_MODEL).trim() || DEFAULT_MODEL;
            const timeoutMs = Math.max(2_000, Math.min(finiteNumber(options.bufferedTimeoutMs, 10_000), 30_000));
            const maxOutputAudioMs = Math.max(2_000, Math.min(finiteNumber(options.maxOutputAudioMs, 45_000), 60_000));
            const maxAudioBytes = Math.max(256_000, Math.min(finiteNumber(options.maxAudioBytes, Math.ceil(24_000 * 2 * maxOutputAudioMs / 1000 * 1.25)), 16 * 1024 * 1024));
            const linked = linkedController(options.signal, timeoutMs);
            try {
              const response = await fetchImpl(ENDPOINT, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  Accept: 'application/json',
                  'x-goog-api-key': apiKey,
                  'Api-Revision': API_REVISION
                },
                body: JSON.stringify({
                  model,
                  input: buildPrompt(text, options.profile),
                  response_format: { type: 'audio' },
                  generation_config: { speech_config: [{ voice: normalizeVoiceName(voiceName) }] },
                  stream: false,
                  store: false
                }),
                signal: linked.controller.signal
              });

              if (!response.ok) {
                let rawBody = '';
                try { rawBody = await response.text(); } catch {}
                let body = null;
                try { body = rawBody ? JSON.parse(rawBody) : null; } catch {}
                const apiStatus = body?.error?.status ?? null;
                const detail = sanitizeHttpErrorDetail(body?.error?.message ?? rawBody, apiKey);
                throw new GeminiTtsHttpError(response.status, apiStatus, detail);
              }

              let interaction;
              try { interaction = await response.json(); }
              catch (error) {
                const parseError = new Error(`Gemini TTS buffered response was not valid JSON: ${error?.message || error}`);
                parseError.name = 'GeminiTtsInvalidResponseError';
                parseError.retryable = true;
                parseError.transportLike = true;
                throw parseError;
              }

              const status = String(interaction?.status ?? '').trim();
              if (status && status !== 'completed') {
                const error = new Error(`Gemini TTS buffered interaction ended with status ${status}.`);
                error.name = 'GeminiTtsIncompleteError';
                error.retryable = ['failed', 'incomplete', 'budget_exceeded'].includes(status);
                error.quotaLike = status === 'budget_exceeded';
                throw error;
              }

              const audio = extractBufferedAudio(interaction);
              if (!audio?.data) throw new Error('Gemini TTS buffered response did not contain inline audio.');
              const audioBuffer = Buffer.from(String(audio.data), 'base64');
              if (!audioBuffer.length) throw new Error('Gemini TTS buffered response contained empty audio.');
              if (audioBuffer.length > maxAudioBytes) {
                const error = new Error(`Gemini TTS exceeded the ${maxAudioBytes}-byte output safety limit.`);
                error.name = 'GeminiTtsOutputLimitError';
                error.runawayLike = true;
                throw error;
              }

              const detected = sniffAudioFormat(audioBuffer, audio.mime_type || audio.mimeType || null);
              return {
                audioBuffer,
                audioFormat: detected.format,
                mimeType: detected.mimeType,
                sampleRate: Math.max(8_000, Math.min(Math.floor(finiteNumber(audio.sample_rate ?? audio.sampleRate, 24_000)), 96_000)),
                channels: Math.max(1, Math.min(Math.floor(finiteNumber(audio.channels, 1)), 2)),
                voice: normalizeVoiceName(voiceName),
                model,
                streamed: false,
                usage: interaction?.usage ?? null
              };
            } catch (error) {
              if (linked.controller.signal.aborted && linked.controller.signal.reason) throw linked.controller.signal.reason;
              throw classifyNetworkError(error, true);
            } finally {
              linked.cleanup();
            }
          }

          '''
          gemini = gemini.replace(marker, buffered_provider + marker, 1)
          dispatch_old = "    try { return await startStreamingRequest(fetchImpl, text, voiceName, apiKey, options); }"
          dispatch_new = "    try {\n      return options.streaming === false\n        ? await startBufferedRequest(fetchImpl, text, voiceName, apiKey, options)\n        : await startStreamingRequest(fetchImpl, text, voiceName, apiKey, options);\n    }"
          if gemini.count(dispatch_old) != 1:
              raise SystemExit('gemini synthesize dispatch anchor mismatch')
          gemini = gemini.replace(dispatch_old, dispatch_new, 1)
          old_export = 'export const __test = { makeBoundary, buildSpeechTurn, parseSseBlock, sniffAudioFormat, cancellationError, sanitizeHttpErrorDetail };'
          new_export = 'export const __test = { makeBoundary, buildSpeechTurn, parseSseBlock, sniffAudioFormat, cancellationError, sanitizeHttpErrorDetail, extractBufferedAudio };'
          if gemini.count(old_export) != 1:
              raise SystemExit('gemini test export anchor mismatch')
          gemini = gemini.replace(old_export, new_export, 1)
          write('src/providers/gemini.js', gemini)

          # Orchestrator: /ask gets a bounded 10s completed-response request; normal paths stay unchanged.
          tts = read('src/tts.js')
          const_anchor = 'const FALLBACK_QUOTA_BACKOFF_SECONDS = 30 * 60;'
          if tts.count(const_anchor) != 1:
              raise SystemExit('tts constant anchor mismatch')
          tts = tts.replace(const_anchor, const_anchor + '\nconst ASK_EXACT_BUFFERED_TIMEOUT_MS = 10_000;', 1)

          function_start = tts.index('function exactFirstAudioWindowCap(context = {}, health = healthOptions()) {')
          insert_at = tts.index('\nfunction stepValue(', function_start)
          helpers = '''\nfunction isBufferedExactContext(context = {}) {
            return context.skipLive === true && context.liveStreamOutput === false;
          }

          function exactAttemptWindowMs(context = {}, health = healthOptions()) {
            if (isBufferedExactContext(context)) return ASK_EXACT_BUFFERED_TIMEOUT_MS;
            return exactFirstAudioWindowCap(context, health);
          }
          '''
          tts = tts[:insert_at] + helpers + tts[insert_at:]

          exact_start = tts.index('function exactOptions(signal, windowMs, apiKey) {')
          google_start = tts.index('\nfunction googleOptions(', exact_start)
          exact_options = '''function exactOptions(signal, windowMs, apiKey, context = {}) {
            const buffered = isBufferedExactContext(context);
            return {
              apiKey,
              model: settings.geminiTts?.model,
              timeoutMs: Math.max(500, Math.min(Number(settings.geminiTts?.timeoutMs) || 4000, windowMs)),
              bufferedTimeoutMs: buffered ? windowMs : undefined,
              streaming: !buffered,
              streamIdleTimeoutMs: Number(settings.geminiTts?.streamIdleTimeoutMs) || 2500,
              maxOutputAudioMs: Number(settings.geminiTts?.maxOutputAudioMs) || 45_000,
              retryCount: 0,
              retryDelayMs: settings.geminiTts?.retryDelayMs,
              profile: exactProfile(),
              signal
            };
          }
          '''
          tts = tts[:exact_start] + exact_options + tts[google_start:]

          synth_start = tts.index('export async function synthesize(text, context = {}) {')
          exact_block_start = tts.index("  if (requestGeminiUsable && !burstBypass() && !geminiAuthDisabled && settings.geminiTts?.enabled !== false) {", synth_start)
          exact_block_end = tts.index('\n  if (hasGemini && burstBypass()) {', exact_block_start)
          exact_block = '''  if (requestGeminiUsable && !burstBypass() && !geminiAuthDisabled && settings.geminiTts?.enabled !== false) {
            const rem = remaining();
            const bufferedExact = isBufferedExactContext(context);
            const exactWindowCap = exactAttemptWindowMs(context, health);
            // /ask already requires complete audio before playback. Use a completed
            // Interactions TTS response instead of streaming SSE into a local buffer.
            // Normal chat's exact fallback remains streaming and keeps its old window.
            const window = bufferedExact
              ? exactWindowCap
              : Math.min(Number(settings.geminiTts?.timeoutMs) || 4000, exactWindowCap, Math.max(350, rem - health.googleReserveMs));
            let exact = await runAttempt({
              key: 'exactTts', providerName: 'gemini-3.1-tts', windowMs: window, parentSignal, attempts,
              factory: (signal) => synthesizeGemini(value, voice, exactOptions(signal, window, requestApiKey, context)),
              priority: attemptPriority,
              apiKeySlot: requestApiKeySlot,
              deferBudgetUntilGeminiSlot: deferGeminiBudgetForPrefetch,
              onLimiterWait: creditLimiterWait
            });
            exact = await bufferSelected(exact, 'gemini-3.1-tts');
            if (exact.result) return generatedResult(exact.result, 'gemini-3.1-tts', exact.elapsed, (exact.firstAudioAt ?? performance.now()) - started, attempts);
          }
          '''
          tts = tts[:exact_block_start] + exact_block + tts[exact_block_end:]

          status_anchor = '    geminiExactTtsEnabled: settings.geminiTts?.enabled !== false,'
          if tts.count(status_anchor) != 1:
              raise SystemExit('tts status anchor mismatch')
          tts = tts.replace(status_anchor, status_anchor + '\n    askExactBufferedTimeoutMs: ASK_EXACT_BUFFERED_TIMEOUT_MS,', 1)
          old_test_export = 'export const __test = { makeBudgetError, googleFallbackWindowMs, setProviderFailure, recordRunawayMidstreamFailure, recordIsolatedLiveMidstreamFailure, shouldIsolateLiveMidstreamFailure, newProviderState, bufferGenerated, healthOptions, exactFirstAudioWindowCap, pacificDailyResetMs, recordGeminiQuotaFailure, providerReady, acquireGeminiSlot, runAttempt, providerConfigSignature, beginHalfOpenProbe, releaseHalfOpenProbe, sanitizeProviderText, sanitizeProviderError };'
          new_test_export = 'export const __test = { makeBudgetError, googleFallbackWindowMs, setProviderFailure, recordRunawayMidstreamFailure, recordIsolatedLiveMidstreamFailure, shouldIsolateLiveMidstreamFailure, newProviderState, bufferGenerated, healthOptions, exactFirstAudioWindowCap, exactAttemptWindowMs, exactOptions, isBufferedExactContext, pacificDailyResetMs, recordGeminiQuotaFailure, providerReady, acquireGeminiSlot, runAttempt, providerConfigSignature, beginHalfOpenProbe, releaseHalfOpenProbe, sanitizeProviderText, sanitizeProviderError };'
          if tts.count(old_test_export) != 1:
              raise SystemExit('tts test export anchor mismatch')
          tts = tts.replace(old_test_export, new_test_export, 1)
          write('src/tts.js', tts)

          commands = read('src/commands.js')
          old_status = '`First-audio budget ${settings.geminiLive?.firstAudioBudgetMs}ms • windows ${settings.providerHealth?.primaryFirstAudioMs}/${settings.providerHealth?.fallbackFirstAudioMs}/${settings.providerHealth?.exactFirstAudioMs}ms • /ask 3.1 first ≤${settings.geminiTts?.timeoutMs}ms • audio stall ≤${settings.geminiTts?.streamIdleTimeoutMs}ms • fresh Google ≤${settings.googleTts?.timeoutMs}ms`'
          new_status = '`First-audio budget ${settings.geminiLive?.firstAudioBudgetMs}ms • windows ${settings.providerHealth?.primaryFirstAudioMs}/${settings.providerHealth?.fallbackFirstAudioMs}/${settings.providerHealth?.exactFirstAudioMs}ms • /ask 3.1 buffered ≤${provider.askExactBufferedTimeoutMs}ms • fresh Google ≤${settings.googleTts?.timeoutMs}ms`'
          if commands.count(old_status) != 1:
              raise SystemExit('status timing anchor mismatch')
          write('src/commands.js', commands.replace(old_status, new_status, 1))

          ask_response = read('src/ask-response.js')
          old_comment = '''      // /ask prioritizes a complete audible answer over first-chunk latency.
                // Buffer the dedicated Gemini TTS stream before playback so a midstream
                // failure is detected inside synthesize() and can fall through to Google
                // instead of being accepted on first audio and then dying silently.'''.replace('                //', '      //')
          new_comment = '''      // /ask prioritizes a complete audible answer over first-chunk latency.
                // This selects a bounded completed-response Gemini 3.1 TTS request instead
                // of streaming SSE into a buffer. On failure it falls through to Google.'''.replace('                //', '      //')
          if ask_response.count(old_comment) != 1:
              raise SystemExit('ask-response comment anchor mismatch')
          write('src/ask-response.js', ask_response.replace(old_comment, new_comment, 1))

          request_test = read('test/gemini-tts-request.test.js')
          test_marker = "test('Gemini TTS surfaces sanitized plain-text HTTP 400 details', async () => {"
          if request_test.count(test_marker) != 1:
              raise SystemExit('gemini request test anchor mismatch')
          unary_test = r'''test('Gemini 3.1 TTS supports completed-audio Interactions for buffered /ask', async () => {
            const apiKey = 'fixture-unary-key';
            const pcm = Buffer.from([1, 2, 3, 4, 5, 6]);
            let captured = null;
            const fetchImpl = async (url, init) => {
              captured = { url, init };
              return new Response(JSON.stringify({
                id: 'int_fixture',
                status: 'completed',
                steps: [{ type: 'model_output', content: [{
                  type: 'audio', data: pcm.toString('base64'), mime_type: 'audio/l16', sample_rate: 24000, channels: 1
                }] }]
              }), { status: 200, headers: { 'content-type': 'application/json' } });
            };

            const generated = await synthesizeGemini('baca jawapan ini', 'Gacrux', {
              apiKey, fetchImpl, streaming: false, bufferedTimeoutMs: 2500
            });

            assert.equal(captured.url, endpoint);
            assert.equal(captured.init.headers.Accept, 'application/json');
            const body = JSON.parse(captured.init.body);
            assert.equal(body.stream, false);
            assert.equal(body.store, false);
            assert.deepEqual(body.response_format, { type: 'audio' });
            assert.deepEqual(generated.audioBuffer, pcm);
            assert.equal(generated.audioStream, undefined);
            assert.equal(generated.mimeType, 'audio/l16');
            assert.equal(generated.audioFormat, 's16le');
            assert.equal(generated.sampleRate, 24000);
            assert.equal(generated.channels, 1);
            assert.equal(generated.streamed, false);
          });

          '''
          write('test/gemini-tts-request.test.js', request_test.replace(test_marker, unary_test + test_marker, 1))

          watchdog = read('test/ask-buffered-tts-watchdog.test.js')
          watchdog_marker = "test('/ask Google fallback receives a fresh first-audio window after exact TTS exhausts the normal budget', () => {"
          if watchdog.count(watchdog_marker) != 1:
              raise SystemExit('ask watchdog test anchor mismatch')
          route_test = r'''test('/ask exact TTS uses bounded completed-response mode while normal exact fallback stays streaming', () => {
            assert.equal(tts.__test.isBufferedExactContext({ skipLive: true, liveStreamOutput: false }), true);
            assert.equal(tts.__test.exactAttemptWindowMs({ skipLive: true, liveStreamOutput: false }), 10000);
            assert.equal(tts.__test.exactAttemptWindowMs({ skipLive: true, liveStreamOutput: true }), 4000);
            const buffered = tts.__test.exactOptions(null, 10000, 'fixture-key', { skipLive: true, liveStreamOutput: false });
            const normal = tts.__test.exactOptions(null, 1600, 'fixture-key', {});
            assert.equal(buffered.streaming, false);
            assert.equal(buffered.bufferedTimeoutMs, 10000);
            assert.equal(normal.streaming, true);
            assert.equal(normal.bufferedTimeoutMs, undefined);
          });

          '''
          write('test/ask-buffered-tts-watchdog.test.js', watchdog.replace(watchdog_marker, route_test + watchdog_marker, 1))
          PY
      - name: Validate
        shell: bash
        run: |
          npm ci
          npm test
          npm audit --audit-level=high
          find src test -name '*.js' -print0 | xargs -0 -n1 node --check
          node - <<'NODE'
          const fs = require('fs');
          const g = fs.readFileSync('src/providers/gemini.js', 'utf8');
          const t = fs.readFileSync('src/tts.js', 'utf8');
          const a = fs.readFileSync('src/ask-response.js', 'utf8');
          const live = fs.readFileSync('src/providers/gemini-live.js', 'utf8');
          if (!g.includes('async function startBufferedRequest')) throw new Error('completed-response provider path missing');
          if (!g.includes('stream: false')) throw new Error('non-streaming Interactions request guard missing');
          if (!t.includes('ASK_EXACT_BUFFERED_TIMEOUT_MS = 10_000')) throw new Error('bounded /ask timeout missing');
          if (!t.includes('streaming: !buffered')) throw new Error('/ask routing missing');
          if (!a.includes('bounded completed-response Gemini 3.1 TTS request')) throw new Error('/ask lifecycle documentation missing');
          if (!live.includes('gemini-3.1-flash-live-preview')) throw new Error('normal 3.1 Live unexpectedly changed');
          NODE
      - name: Commit focused fix
        shell: bash
        run: |
          rm -f .github/workflows/temp-fix-ask-unary-tts.yml
          git config user.name 'MrEz'
          git config user.email '39240221+Zudin987@users.noreply.github.com'
          git add -A
          git commit -m 'Fix /ask Gemini TTS with bounded completed audio'
          git push origin HEAD:fix/ask-unary-gemini-tts
