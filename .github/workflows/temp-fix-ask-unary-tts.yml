name: Prepare ask unary Gemini TTS fix

on:
  push:
    branches:
      - fix/ask-unary-gemini-tts

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ask-unary-gemini-tts
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply focused fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement anchor, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          gemini_insert = r'''function extractBufferedAudio(interaction) {
            const direct = interaction?.output_audio ?? interaction?.outputAudio;
            if (direct?.data) return direct;

            const steps = Array.isArray(interaction?.steps) ? interaction.steps : [];
            for (let stepIndex = steps.length - 1; stepIndex >= 0; stepIndex -= 1) {
              const step = steps[stepIndex];
              if (step?.type !== 'model_output') continue;
              const content = Array.isArray(step.content) ? step.content : (step?.content ? [step.content] : []);
              for (let contentIndex = content.length - 1; contentIndex >= 0; contentIndex -= 1) {
                const item = content[contentIndex];
                if (item?.type === 'audio' && item?.data) return item;
              }
            }

            const outputs = Array.isArray(interaction?.outputs) ? interaction.outputs : [];
            for (let index = outputs.length - 1; index >= 0; index -= 1) {
              const item = outputs[index];
              if (item?.type === 'audio' && item?.data) return item;
            }
            return null;
          }

          async function startBufferedRequest(fetchImpl, text, voiceName, apiKey, options) {
            const model = String(options.model || DEFAULT_MODEL).trim() || DEFAULT_MODEL;
            const timeoutMs = Math.max(2_000, Math.min(finiteNumber(options.bufferedTimeoutMs, 10_000), 30_000));
            const maxOutputAudioMs = Math.max(2_000, Math.min(finiteNumber(options.maxOutputAudioMs, 45_000), 60_000));
            const maxAudioBytes = Math.max(256_000, Math.min(finiteNumber(options.maxAudioBytes, Math.ceil(24_000 * 2 * maxOutputAudioMs / 1000 * 1.25)), 16 * 1024 * 1024));
            const linked = linkedController(options.signal, timeoutMs);
            let response;
            try {
              response = await fetchImpl(ENDPOINT, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  Accept: 'application/json',
                  'x-goog-api-key': apiKey,
                  'Api-Revision': API_REVISION
                },
                body: JSON.stringify({
                  model,
                  input: buildPrompt(text, options.profile),
                  response_format: { type: 'audio' },
                  generation_config: { speech_config: [{ voice: normalizeVoiceName(voiceName) }] },
                  stream: false,
                  store: false
                }),
                signal: linked.controller.signal
              });

              if (!response.ok) {
                let rawBody = '';
                try { rawBody = await response.text(); } catch {}
                let body = null;
                try { body = rawBody ? JSON.parse(rawBody) : null; } catch {}
                const apiStatus = body?.error?.status ?? null;
                const detail = sanitizeHttpErrorDetail(body?.error?.message ?? rawBody, apiKey);
                throw new GeminiTtsHttpError(response.status, apiStatus, detail);
              }

              let interaction;
              try { interaction = await response.json(); }
              catch (error) {
                const parseError = new Error(`Gemini TTS buffered response was not valid JSON: ${error?.message || error}`);
                parseError.name = 'GeminiTtsInvalidResponseError';
                parseError.retryable = true;
                parseError.transportLike = true;
                throw parseError;
              }

              const status = String(interaction?.status ?? '').trim();
              if (status && status !== 'completed') {
                const error = new Error(`Gemini TTS buffered interaction ended with status ${status}.`);
                error.name = 'GeminiTtsIncompleteError';
                error.retryable = ['failed', 'incomplete', 'budget_exceeded'].includes(status);
                error.quotaLike = status === 'budget_exceeded';
                throw error;
              }

              const audio = extractBufferedAudio(interaction);
              if (!audio?.data) throw new Error('Gemini TTS buffered response did not contain inline audio.');
              const audioBuffer = Buffer.from(String(audio.data), 'base64');
              if (!audioBuffer.length) throw new Error('Gemini TTS buffered response contained empty audio.');
              if (audioBuffer.length > maxAudioBytes) {
                const error = new Error(`Gemini TTS exceeded the ${maxAudioBytes}-byte output safety limit.`);
                error.name = 'GeminiTtsOutputLimitError';
                error.runawayLike = true;
                throw error;
              }

              const mimeType = audio.mime_type || audio.mimeType || null;
              const detected = sniffAudioFormat(audioBuffer, mimeType);
              return {
                audioBuffer,
                audioFormat: detected.format,
                mimeType: detected.mimeType,
                sampleRate: Math.max(8_000, Math.min(Math.floor(finiteNumber(audio.sample_rate ?? audio.sampleRate, 24_000)), 96_000)),
                channels: Math.max(1, Math.min(Math.floor(finiteNumber(audio.channels, 1)), 2)),
                voice: normalizeVoiceName(voiceName),
                model,
                streamed: false,
                usage: interaction?.usage ?? null
              };
            } catch (error) {
              if (linked.controller.signal.aborted && linked.controller.signal.reason) throw linked.controller.signal.reason;
              throw classifyNetworkError(error, true);
            } finally {
              linked.cleanup();
            }
          }

          '''
          replace_once(
              'src/providers/gemini.js',
              'async function startStreamingRequest(fetchImpl, text, voiceName, apiKey, options) {',
              gemini_insert + 'async function startStreamingRequest(fetchImpl, text, voiceName, apiKey, options) {'
          )
          replace_once(
              'src/providers/gemini.js',
              "    try { return await startStreamingRequest(fetchImpl, text, voiceName, apiKey, options); }",
              "    try {\n      return options.streaming === false\n        ? await startBufferedRequest(fetchImpl, text, voiceName, apiKey, options)\n        : await startStreamingRequest(fetchImpl, text, voiceName, apiKey, options);\n    }"
          )
          replace_once(
              'src/providers/gemini.js',
              'export const __test = { makeBoundary, buildSpeechTurn, parseSseBlock, sniffAudioFormat, cancellationError, sanitizeHttpErrorDetail };',
              'export const __test = { makeBoundary, buildSpeechTurn, parseSseBlock, sniffAudioFormat, cancellationError, sanitizeHttpErrorDetail, extractBufferedAudio };'
          )

          replace_once(
              'src/tts.js',
              'const FALLBACK_QUOTA_BACKOFF_SECONDS = 30 * 60;',
              'const FALLBACK_QUOTA_BACKOFF_SECONDS = 30 * 60;\nconst ASK_EXACT_BUFFERED_TIMEOUT_MS = 10_000;'
          )
          old = '''function exactFirstAudioWindowCap(context = {}, health = healthOptions()) {
            // Explicit skipLive is the dedicated exact-TTS path used by /ask. Normal
            // Live-first chat keeps the short exact fallback window for latency.
            return context.skipLive === true
              ? Math.max(500, Number(settings.geminiTts?.timeoutMs) || 4000)
              : health.exactFirstAudioMs;
          }
          '''
          new = old + '''
          function isBufferedExactContext(context = {}) {
            return context.skipLive === true && context.liveStreamOutput === false;
          }

          function exactAttemptWindowMs(context = {}, health = healthOptions()) {
            if (isBufferedExactContext(context)) return ASK_EXACT_BUFFERED_TIMEOUT_MS;
            return exactFirstAudioWindowCap(context, health);
          }
          '''
          replace_once('src/tts.js', old, new)

          old_exact_options = '''function exactOptions(signal, windowMs, apiKey) {
            return {
              apiKey,
              model: settings.geminiTts?.model,
              timeoutMs: Math.max(500, Math.min(Number(settings.geminiTts?.timeoutMs) || 4000, windowMs)),
              streamIdleTimeoutMs: Number(settings.geminiTts?.streamIdleTimeoutMs) || 2500,
              maxOutputAudioMs: Number(settings.geminiTts?.maxOutputAudioMs) || 45_000,
              retryCount: 0,
              retryDelayMs: settings.geminiTts?.retryDelayMs,
              profile: exactProfile(),
              signal
            };
          }
          '''
          new_exact_options = '''function exactOptions(signal, windowMs, apiKey, context = {}) {
            const buffered = isBufferedExactContext(context);
            return {
              apiKey,
              model: settings.geminiTts?.model,
              timeoutMs: Math.max(500, Math.min(Number(settings.geminiTts?.timeoutMs) || 4000, windowMs)),
              bufferedTimeoutMs: buffered ? windowMs : undefined,
              streaming: !buffered,
              streamIdleTimeoutMs: Number(settings.geminiTts?.streamIdleTimeoutMs) || 2500,
              maxOutputAudioMs: Number(settings.geminiTts?.maxOutputAudioMs) || 45_000,
              retryCount: 0,
              retryDelayMs: settings.geminiTts?.retryDelayMs,
              profile: exactProfile(),
              signal
            };
          }
          '''
          replace_once('src/tts.js', old_exact_options, new_exact_options)

          old_block = '''  if (requestGeminiUsable && !burstBypass() && !geminiAuthDisabled && settings.geminiTts?.enabled !== false) {
            const rem = remaining();
            const exactWindowCap = exactFirstAudioWindowCap(context, health);
            const window = Math.min(Number(settings.geminiTts?.timeoutMs) || 4000, exactWindowCap, Math.max(350, rem - health.googleReserveMs));
            let exact = await runAttempt({
              key: 'exactTts', providerName: 'gemini-3.1-tts', windowMs: window, parentSignal, attempts,
              factory: (signal) => synthesizeGemini(value, voice, exactOptions(signal, window, requestApiKey)),
              priority: attemptPriority,
              apiKeySlot: requestApiKeySlot,
              deferBudgetUntilGeminiSlot: deferGeminiBudgetForPrefetch,
              onLimiterWait: creditLimiterWait
            });
            exact = await bufferSelected(exact, 'gemini-3.1-tts');
            if (exact.result) return generatedResult(exact.result, 'gemini-3.1-tts', exact.elapsed, (exact.firstAudioAt ?? performance.now()) - started, attempts);
          }
          '''
          new_block = '''  if (requestGeminiUsable && !burstBypass() && !geminiAuthDisabled && settings.geminiTts?.enabled !== false) {
            const rem = remaining();
            const bufferedExact = isBufferedExactContext(context);
            const exactWindowCap = exactAttemptWindowMs(context, health);
            // /ask already requires a complete audio result before playback. Use the
            // documented unary Interactions TTS request instead of streaming into a
            // buffer, and give that completed-response request one bounded window.
            const window = bufferedExact
              ? exactWindowCap
              : Math.min(Number(settings.geminiTts?.timeoutMs) || 4000, exactWindowCap, Math.max(350, rem - health.googleReserveMs));
            let exact = await runAttempt({
              key: 'exactTts', providerName: 'gemini-3.1-tts', windowMs: window, parentSignal, attempts,
              factory: (signal) => synthesizeGemini(value, voice, exactOptions(signal, window, requestApiKey, context)),
              priority: attemptPriority,
              apiKeySlot: requestApiKeySlot,
              deferBudgetUntilGeminiSlot: deferGeminiBudgetForPrefetch,
              onLimiterWait: creditLimiterWait
            });
            exact = await bufferSelected(exact, 'gemini-3.1-tts');
            if (exact.result) return generatedResult(exact.result, 'gemini-3.1-tts', exact.elapsed, (exact.firstAudioAt ?? performance.now()) - started, attempts);
          }
          '''
          replace_once('src/tts.js', old_block, new_block)
          replace_once(
              'src/tts.js',
              '    geminiExactTtsEnabled: settings.geminiTts?.enabled !== false,',
              '    geminiExactTtsEnabled: settings.geminiTts?.enabled !== false,\n    askExactBufferedTimeoutMs: ASK_EXACT_BUFFERED_TIMEOUT_MS,'
          )
          replace_once(
              'src/tts.js',
              'export const __test = { makeBudgetError, googleFallbackWindowMs, setProviderFailure, recordRunawayMidstreamFailure, recordIsolatedLiveMidstreamFailure, shouldIsolateLiveMidstreamFailure, newProviderState, bufferGenerated, healthOptions, exactFirstAudioWindowCap, pacificDailyResetMs, recordGeminiQuotaFailure, providerReady, acquireGeminiSlot, runAttempt, providerConfigSignature, beginHalfOpenProbe, releaseHalfOpenProbe, sanitizeProviderText, sanitizeProviderError };',
              'export const __test = { makeBudgetError, googleFallbackWindowMs, setProviderFailure, recordRunawayMidstreamFailure, recordIsolatedLiveMidstreamFailure, shouldIsolateLiveMidstreamFailure, newProviderState, bufferGenerated, healthOptions, exactFirstAudioWindowCap, exactAttemptWindowMs, exactOptions, isBufferedExactContext, pacificDailyResetMs, recordGeminiQuotaFailure, providerReady, acquireGeminiSlot, runAttempt, providerConfigSignature, beginHalfOpenProbe, releaseHalfOpenProbe, sanitizeProviderText, sanitizeProviderError };'
          )

          replace_once(
              'src/commands.js',
              "            `First-audio budget ${settings.geminiLive?.firstAudioBudgetMs}ms • windows ${settings.providerHealth?.primaryFirstAudioMs}/${settings.providerHealth?.fallbackFirstAudioMs}/${settings.providerHealth?.exactFirstAudioMs}ms • /ask 3.1 first ≤${settings.geminiTts?.timeoutMs}ms • audio stall ≤${settings.geminiTts?.streamIdleTimeoutMs}ms • fresh Google ≤${settings.googleTts?.timeoutMs}ms`,",
              "            `First-audio budget ${settings.geminiLive?.firstAudioBudgetMs}ms • windows ${settings.providerHealth?.primaryFirstAudioMs}/${settings.providerHealth?.fallbackFirstAudioMs}/${settings.providerHealth?.exactFirstAudioMs}ms • /ask 3.1 buffered ≤${provider.askExactBufferedTimeoutMs}ms • fresh Google ≤${settings.googleTts?.timeoutMs}ms`,"
          )

          old_comment = '''      // /ask prioritizes a complete audible answer over first-chunk latency.
                // Buffer the dedicated Gemini TTS stream before playback so a midstream
                // failure is detected inside synthesize() and can fall through to Google
                // instead of being accepted on first audio and then dying silently.
                forceBuffered: true'''
          new_comment = '''      // /ask prioritizes a complete audible answer over first-chunk latency.
                // This flag selects the completed-response Gemini 3.1 TTS request rather
                // than streaming SSE into a buffer. If that bounded request fails, the
                // deterministic Google Malay fallback is used.
                forceBuffered: true'''
          replace_once('src/ask-response.js', old_comment, new_comment)

          new_test = r'''test('Gemini 3.1 TTS supports unary completed-audio interactions for buffered /ask', async () => {
            const apiKey = 'fixture-unary-key';
            const pcm = Buffer.from([1, 2, 3, 4, 5, 6]);
            let captured = null;
            const fetchImpl = async (url, init) => {
              captured = { url, init };
              return new Response(JSON.stringify({
                id: 'int_fixture',
                status: 'completed',
                steps: [{
                  type: 'model_output',
                  content: [{
                    type: 'audio',
                    data: pcm.toString('base64'),
                    mime_type: 'audio/l16',
                    sample_rate: 24000,
                    channels: 1
                  }]
                }]
              }), { status: 200, headers: { 'content-type': 'application/json' } });
            };

            const generated = await synthesizeGemini('baca jawapan ini', 'Gacrux', {
              apiKey,
              fetchImpl,
              streaming: false,
              bufferedTimeoutMs: 1000
            });

            assert.equal(captured.url, endpoint);
            assert.equal(captured.init.headers.Accept, 'application/json');
            const body = JSON.parse(captured.init.body);
            assert.equal(body.stream, false);
            assert.equal(body.store, false);
            assert.deepEqual(body.response_format, { type: 'audio' });
            assert.deepEqual(generated.audioBuffer, pcm);
            assert.equal(generated.audioStream, undefined);
            assert.equal(generated.mimeType, 'audio/l16');
            assert.equal(generated.audioFormat, 's16le');
            assert.equal(generated.sampleRate, 24000);
            assert.equal(generated.channels, 1);
            assert.equal(generated.streamed, false);
          });

          '''
          replace_once(
              'test/gemini-tts-request.test.js',
              "test('Gemini TTS surfaces sanitized plain-text HTTP 400 details', async () => {",
              new_test + "test('Gemini TTS surfaces sanitized plain-text HTTP 400 details', async () => {"
          )

          new_watchdog_test = r'''test('/ask exact TTS uses bounded unary mode while normal exact fallback stays streaming', () => {
            assert.equal(tts.__test.isBufferedExactContext({ skipLive: true, liveStreamOutput: false }), true);
            assert.equal(tts.__test.exactAttemptWindowMs({ skipLive: true, liveStreamOutput: false }), 10000);
            assert.equal(tts.__test.exactAttemptWindowMs({ skipLive: true, liveStreamOutput: true }), 4000);
            const buffered = tts.__test.exactOptions(null, 10000, 'fixture-key', { skipLive: true, liveStreamOutput: false });
            const normal = tts.__test.exactOptions(null, 1600, 'fixture-key', {});
            assert.equal(buffered.streaming, false);
            assert.equal(buffered.bufferedTimeoutMs, 10000);
            assert.equal(normal.streaming, true);
            assert.equal(normal.bufferedTimeoutMs, undefined);
          });

          '''
          replace_once(
              'test/ask-buffered-tts-watchdog.test.js',
              "test('/ask Google fallback receives a fresh first-audio window after exact TTS exhausts the normal budget', () => {",
              new_watchdog_test + "test('/ask Google fallback receives a fresh first-audio window after exact TTS exhausts the normal budget', () => {"
          )
          PY
      - name: Validate
        shell: bash
        run: |
          npm ci
          npm test
          npm audit --audit-level=high
          find src test -name '*.js' -print0 | xargs -0 -n1 node --check
          node - <<'NODE'
          const fs = require('fs');
          const g = fs.readFileSync('src/providers/gemini.js', 'utf8');
          const t = fs.readFileSync('src/tts.js', 'utf8');
          const a = fs.readFileSync('src/ask-response.js', 'utf8');
          if (!g.includes('async function startBufferedRequest')) throw new Error('unary provider path missing');
          if (!g.includes('stream: false')) throw new Error('unary Interactions request guard missing');
          if (!t.includes('ASK_EXACT_BUFFERED_TIMEOUT_MS = 10_000')) throw new Error('bounded /ask timeout missing');
          if (!t.includes('streaming: !buffered')) throw new Error('/ask unary routing missing');
          if (!a.includes('completed-response Gemini 3.1 TTS request')) throw new Error('/ask lifecycle documentation missing');
          NODE
      - name: Commit focused fix
        shell: bash
        run: |
          rm -f .github/workflows/temp-fix-ask-unary-tts.yml
          git config user.name 'MrEz'
          git config user.email '39240221+Zudin987@users.noreply.github.com'
          git add -A
          git commit -m 'Fix /ask Gemini TTS with bounded unary audio'
          git push origin HEAD:fix/ask-unary-gemini-tts
