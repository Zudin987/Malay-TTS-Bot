name: Prepare v0.23.5 Release Metadata

on:
  push:
    branches: ['audit/v0.23.5']
    paths:
      - '.github/workflows/release-prep-v0235.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/v0.23.5
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Apply v0.23.5 release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if count is not None and actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old!r}')
              if actual == 0:
                  raise SystemExit(f'{path}: missing expected text: {old!r}')
              p.write_text(text.replace(old, new))

          replace_exact('package.json', '"version": "0.23.4"', '"version": "0.23.5"', 1)
          replace_exact('package-lock.json', '"version": "0.23.4"', '"version": "0.23.5"', 2)
          replace_exact('setup-clean.cmd', 'Malay TTS Bot clean setup v0.23.4', 'Malay TTS Bot clean setup v0.23.5', 1)
          replace_exact('src/providers/gemini.js', "'x-goog-api-client': 'malay-tts-bot/0.23.4'", "'x-goog-api-client': 'malay-tts-bot/0.23.5'", 1)
          replace_exact('test/regression.test.js', "test('v0.23.4 defaults keep adaptive Live audio-end grace and current speaker/message gain'", "test('v0.23.5 defaults keep adaptive Live audio-end grace and current speaker/message gain'", 1)
          replace_exact('test/regression.test.js', "test('v0.23.4 voice pool is restricted to Charon, Enceladus, Aoede and Despina'", "test('v0.23.5 voice pool is restricted to Charon, Enceladus, Aoede and Despina'", 1)
          replace_exact('MAINTENANCE.md', 'Current stable baseline: **v0.23.4 — Audit Hardening**.', 'Current stable baseline: **v0.23.5 — Reliability & Privacy Hardening**.', 1)

          readme = Path('README.md')
          text = readme.read_text()
          header = '# Malay TTS Bot — v0.23.4 — Audit Hardening'
          if text.count(header) != 1:
              raise SystemExit('README release header mismatch')
          text = text.replace(header, '# Malay TTS Bot — v0.23.5 — Reliability & Privacy Hardening', 1)
          anchor = """## v0.23.4 highlights

- **Adaptive Gemini Live audio-end grace.**"""
          replacement = """## v0.23.5 highlights

- **Cancellation-safe streamed provider backpressure.** Gemini 3.1 Flash TTS and Google Malay fallback now stop waiting for `drain` when their output stream is aborted, closed or errors, preventing cancelled work from hanging completion or retaining a Gemini concurrency slot.
- **Privacy opt-out no longer has a hidden 500-user ceiling.** Both guild-state normalization and `/ttsoptout` mutation preserve the complete valid opted-out user set instead of silently dropping later entries.
- **Speaker-label decoder lifetime is bounded.** A wedged FFmpeg speaker-label decode is terminated by a hard watchdog instead of surviving after the foreground label wait has already timed out.
- **Release hygiene is stricter.** CI now rejects `guilds.json.bak`, stale lock/stop files and temp/runtime artifacts in addition to the existing secret/cache/log guards.
- **CI is fully Node-24-native.** GitHub Actions uses checkout/setup-node v7, Ubuntu runs `npm audit --audit-level=high`, and the suite remains cross-platform on Ubuntu and Windows.
- **Regression suite expanded to 57 tests.** New coverage exercises provider cancellation while backpressured, >500-user opt-out persistence/mutation, and wedged speaker-label FFmpeg termination.

### v0.23.4 hardening retained

- **Adaptive Gemini Live audio-end grace.**"""
          if text.count(anchor) != 1:
              raise SystemExit('README highlights anchor mismatch')
          text = text.replace(anchor, replacement, 1)
          text = text.replace('**Do not restore an old `config\\settings.json`**; v0.23.4 ships new defaults/fields.', '**Do not restore an old `config\\settings.json`**; v0.23.5 ships the release defaults.', 1)
          text = text.replace('Generative Live speech still cannot provide a mathematical guarantee that it will never produce an extra sound/word. v0.23.4 retains the hardened prompts/recovery,', 'Generative Live speech still cannot provide a mathematical guarantee that it will never produce an extra sound/word. v0.23.5 retains the hardened prompts/recovery,', 1)
          readme.write_text(text)

          old_release = Path('RELEASE-v0.23.4.txt')
          if not old_release.exists():
              raise SystemExit('missing RELEASE-v0.23.4.txt')
          old_release.unlink()
          Path('RELEASE-v0.23.5.txt').write_text("""Malay TTS Bot v0.23.5 — Reliability & Privacy Hardening

Source: v0.23.4 Audit Hardening stable release.
Priority: latency > quality > features.

Reliability / privacy fixes:
- Gemini 3.1 Flash TTS and Google Malay fallback now use abort/error/close-aware writable backpressure handling. Cancelling a provider while its output is waiting for drain can no longer leave completion stuck; Gemini therefore cannot retain one of the two global generation slots through this path.
- TTS privacy opt-out IDs are no longer silently truncated at 500 entries. The full valid set is preserved both when guild state is normalized and when /ttsoptout mutates persisted state.
- Speaker-label FFmpeg decoding has a bounded watchdog. A wedged child is terminated instead of remaining alive after the foreground label wait has already fallen back to message playback.
- CI release hygiene now also rejects data/guilds.json.bak, data/bot.lock, data/stop.request and temp/runtime artifacts.

Validation / release process:
- Regression suite expanded from 52 to 57 tests.
- Added Gemini exact-TTS cancellation-under-backpressure coverage.
- Added Google fallback cancellation-under-backpressure coverage.
- Added >500-user privacy opt-out normalization and mutation coverage.
- Added speaker-label FFmpeg watchdog/termination coverage.
- Node 24 CI passes on Ubuntu and Windows.
- Ubuntu CI runs npm audit and the actual FFmpeg volume + limiter + libopus/Ogg encode/decode probe.
- GitHub Actions checkout/setup-node use their Node-24-native v7 majors.
- Final release-prep gate runs the complete regression suite five consecutive times.

Retained:
- Provider order remains Gemini 3.1 Live -> Gemini 2.5 Live -> Gemini 3.1 TTS -> Google Malay TTS.
- Voice pool remains Charon, Enceladus, Aoede and Despina.
- One Discord message = one TTS item. No message merging and no multi-turn Gemini Live reuse.
- Speaker username remains separate Google Malay TTS audio and is never inserted into Gemini message text.
- Clean audio defaults remain fixedVolume 0.60 and speakerLabel.gain 1.50.
- Free-first / billing-disabled operating model remains unchanged.

Deferred non-critical notes:
- stop-bot.js intentionally avoids killing a PID that no longer matches the recorded bot process identity; in the extremely rare stale-lock/PID-reuse case this can cost only the stop timeout.
- Gemini orchestrator retries remain effectively disabled for latency-first failover; retry-count configuration cleanup can remain a later maintenance change.

Upgrade:
Preserve only .env and data\\guilds.json. Do not restore an old config\\settings.json. Replace the old folder with the v0.23.5 clean package, restore those two files, then run setup-clean.cmd.
""")
          PY

          test ! -e RELEASE-v0.23.4.txt
          test -e RELEASE-v0.23.5.txt
          ! grep -q 'malay-tts-bot/0.23.4' src/providers/gemini.js
          ! grep -q '"version": "0.23.4"' package.json package-lock.json
          ! grep -q 'clean setup v0.23.4' setup-clean.cmd
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript and JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
          node -e "const fs=require('fs'),p=require('path'); const files=['package.json','package-lock.json',...fs.readdirSync('config').filter(x=>x.endsWith('.json')).map(x=>p.join('config',x))]; for(const f of files) JSON.parse(fs.readFileSync(f,'utf8')); console.log('Validated '+files.length+' JSON file(s).')"

      - name: Five consecutive regression passes
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "=== Regression pass $i / 5 ==="
            npm test
          done

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Release hygiene guard
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e data/guilds.json
          test ! -e data/guilds.json.bak
          test ! -e data/bot.lock
          test ! -e data/stop.request
          test ! -d data/speaker-label-cache
          test ! -d runtime
          test ! -d temp
          test ! -e bot.log
          test ! -e bot-old.log

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md MAINTENANCE.md RELEASE-v0.23.4.txt RELEASE-v0.23.5.txt package.json package-lock.json setup-clean.cmd src/providers/gemini.js test/regression.test.js
          git commit -m 'chore: finalize v0.23.5 release metadata'
          git push origin HEAD:audit/v0.23.5
