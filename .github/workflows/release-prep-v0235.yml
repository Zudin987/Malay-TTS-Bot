name: Prepare v0.23.5 Release

on:
  push:
    branches: ['audit/v0.23.5']

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/v0.23.5
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Update release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          VERSION = '0.23.5'

          def write_json(path, data):
              Path(path).write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          if package.get('version') != '0.23.4':
              raise SystemExit(f"Unexpected package version: {package.get('version')}")
          package['version'] = VERSION
          write_json('package.json', package)

          lock = json.loads(Path('package-lock.json').read_text(encoding='utf-8'))
          if lock.get('version') != '0.23.4' or lock.get('packages', {}).get('', {}).get('version') != '0.23.4':
              raise SystemExit('Unexpected package-lock baseline version')
          lock['version'] = VERSION
          lock['packages']['']['version'] = VERSION
          write_json('package-lock.json', lock)

          setup_path = Path('setup-clean.cmd')
          setup = setup_path.read_text(encoding='utf-8')
          if 'clean setup v0.23.4' not in setup:
              raise SystemExit('setup-clean version anchor missing')
          setup_path.write_text(setup.replace('clean setup v0.23.4', 'clean setup v0.23.5'), encoding='utf-8')

          gemini_path = Path('src/providers/gemini.js')
          gemini = gemini_path.read_text(encoding='utf-8')
          if 'malay-tts-bot/0.23.4' not in gemini:
              raise SystemExit('Gemini client version anchor missing')
          gemini_path.write_text(gemini.replace('malay-tts-bot/0.23.4', 'malay-tts-bot/0.23.5'), encoding='utf-8')

          regression_path = Path('test/regression.test.js')
          regression = regression_path.read_text(encoding='utf-8')
          old_default = 'v0.23.4 defaults keep adaptive Live audio-end grace and current speaker/message gain'
          old_voice = 'v0.23.4 voice pool is restricted to Charon, Enceladus, Aoede and Despina'
          if old_default not in regression or old_voice not in regression:
              raise SystemExit('Regression release-label anchor missing')
          regression = regression.replace(old_default, 'v0.23.5 defaults keep adaptive Live audio-end grace and current speaker/message gain')
          regression = regression.replace(old_voice, 'v0.23.5 voice pool is restricted to Charon, Enceladus, Aoede and Despina')
          regression_path.write_text(regression, encoding='utf-8')

          maintenance_path = Path('MAINTENANCE.md')
          maintenance = maintenance_path.read_text(encoding='utf-8')
          baseline = 'Current stable baseline: **v0.23.4 — Audit Hardening**.'
          if baseline not in maintenance:
              raise SystemExit('Maintenance baseline anchor missing')
          maintenance_path.write_text(maintenance.replace(baseline, 'Current stable baseline: **v0.23.5 — Reliability & Privacy Hardening**.'), encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_header = '# Malay TTS Bot — v0.23.4 — Audit Hardening'
          old_marker = '## v0.23.4 highlights\n\n- **Adaptive Gemini Live audio-end grace.**'
          if old_header not in readme or old_marker not in readme:
              raise SystemExit('README release anchors missing')
          readme = readme.replace(old_header, '# Malay TTS Bot — v0.23.5 — Reliability & Privacy Hardening', 1)
          new_highlights = (
              '## v0.23.5 highlights\n\n'
              '- **Cancellation-safe streamed provider backpressure.** Gemini 3.1 Flash TTS and Google Malay fallback now stop waiting for `drain` when output is aborted, closed or errors, preventing cancelled work from hanging completion or retaining a Gemini concurrency slot.\n'
              '- **Privacy opt-out has no hidden 500-user ceiling.** Guild-state normalization and `/ttsoptout` mutation both preserve the complete valid opted-out user set.\n'
              '- **Speaker-label decoder lifetime is bounded.** A wedged FFmpeg speaker-label decode is terminated by a hard watchdog instead of surviving after the foreground label wait times out.\n'
              '- **Release hygiene is stricter.** CI rejects `guilds.json.bak`, stale lock/stop files and temp/runtime artifacts in addition to existing secret/cache/log guards.\n'
              '- **CI is Node-24-native.** GitHub Actions uses checkout/setup-node v7, Ubuntu runs dependency audit, and the full suite remains cross-platform on Ubuntu and Windows.\n'
              '- **Regression suite expanded to 57 tests.** New coverage exercises provider cancellation while backpressured, >500-user opt-out persistence/mutation, and wedged speaker-label FFmpeg termination.\n\n'
              '### v0.23.4 hardening retained\n\n'
              '- **Adaptive Gemini Live audio-end grace.**'
          )
          readme = readme.replace(old_marker, new_highlights, 1)
          readme = readme.replace('**Do not restore an old `config\\settings.json`**; v0.23.4 ships new defaults/fields.', '**Do not restore an old `config\\settings.json`**; v0.23.5 ships the release defaults.', 1)
          readme = readme.replace('Generative Live speech still cannot provide a mathematical guarantee that it will never produce an extra sound/word. v0.23.4 retains the hardened prompts/recovery,', 'Generative Live speech still cannot provide a mathematical guarantee that it will never produce an extra sound/word. v0.23.5 retains the hardened prompts/recovery,', 1)
          readme_path.write_text(readme, encoding='utf-8')

          old_release = Path('RELEASE-v0.23.4.txt')
          if not old_release.exists():
              raise SystemExit('Missing v0.23.4 release note')
          old_release.unlink()
          release_lines = [
              'Malay TTS Bot v0.23.5 — Reliability & Privacy Hardening',
              '',
              'Source: v0.23.4 Audit Hardening stable release.',
              'Priority: latency > quality > features.',
              '',
              'Reliability / privacy fixes:',
              '- Gemini 3.1 Flash TTS and Google Malay fallback now use abort/error/close-aware writable backpressure handling. Cancelling while output is waiting for drain can no longer leave provider completion stuck or retain a Gemini concurrency slot.',
              '- TTS privacy opt-out IDs are no longer silently truncated at 500 entries. The full valid set is preserved during guild-state normalization and /ttsoptout mutation.',
              '- Speaker-label FFmpeg decoding has a bounded watchdog. A wedged child is terminated instead of remaining alive after the foreground label wait has already fallen back to message playback.',
              '- CI release hygiene now also rejects data/guilds.json.bak, data/bot.lock, data/stop.request and temp/runtime artifacts.',
              '',
              'Validation / release process:',
              '- Regression suite expanded from 52 to 57 tests.',
              '- Added Gemini exact-TTS and Google fallback cancellation-under-backpressure coverage.',
              '- Added >500-user privacy opt-out normalization and mutation coverage.',
              '- Added speaker-label FFmpeg watchdog/termination coverage.',
              '- Node 24 CI passes on Ubuntu and Windows.',
              '- Ubuntu CI runs npm audit and the actual FFmpeg volume + limiter + libopus/Ogg encode/decode probe.',
              '- GitHub Actions checkout/setup-node use their Node-24-native v7 majors.',
              '- Final release-prep gate runs the complete regression suite five consecutive times.',
              '',
              'Retained:',
              '- Provider order remains Gemini 3.1 Live -> Gemini 2.5 Live -> Gemini 3.1 TTS -> Google Malay TTS.',
              '- Voice pool remains Charon, Enceladus, Aoede and Despina.',
              '- One Discord message = one TTS item. No message merging and no multi-turn Gemini Live reuse.',
              '- Speaker username remains separate Google Malay TTS audio and is never inserted into Gemini message text.',
              '- Clean audio defaults remain fixedVolume 0.60 and speakerLabel.gain 1.50.',
              '- Free-first / billing-disabled operating model remains unchanged.',
              '',
              'Deferred non-critical notes:',
              '- stop-bot.js intentionally avoids killing a PID that no longer matches the recorded bot process identity; in the extremely rare stale-lock/PID-reuse case this can cost only the stop timeout.',
              '- Gemini orchestrator retries remain effectively disabled for latency-first failover; retry-count configuration cleanup can remain a later maintenance change.',
              '',
              'Upgrade:',
              'Preserve only .env and data\\guilds.json. Do not restore an old config\\settings.json. Replace the old folder with the v0.23.5 clean package, restore those two files, then run setup-clean.cmd.',
          ]
          Path('RELEASE-v0.23.5.txt').write_text('\n'.join(release_lines) + '\n', encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript and JSON
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const files = ['package.json', 'package-lock.json', ...fs.readdirSync('config').filter((x) => x.endsWith('.json')).map((x) => path.join('config', x))];
          for (const file of files) JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log(`Validated ${files.length} JSON file(s).`);
          NODE
          git diff --check

      - name: Five consecutive regression passes
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "=== Regression pass $i / 5 ==="
            npm test
          done

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Release hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e RELEASE-v0.23.4.txt
          test -e RELEASE-v0.23.5.txt
          test "$(node -p "require('./package.json').version")" = "0.23.5"
          test "$(node -p "require('./package-lock.json').version")" = "0.23.5"
          ! grep -q 'malay-tts-bot/0.23.4' src/providers/gemini.js
          ! grep -q 'clean setup v0.23.4' setup-clean.cmd
          ! grep -q 'v0.23.4 defaults keep adaptive' test/regression.test.js
          test ! -e .env
          test ! -e data/guilds.json
          test ! -e data/guilds.json.bak
          test ! -e data/bot.lock
          test ! -e data/stop.request
          test ! -d data/speaker-label-cache
          test ! -d runtime
          test ! -d temp
          test ! -e bot.log
          test ! -e bot-old.log

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md MAINTENANCE.md RELEASE-v0.23.4.txt RELEASE-v0.23.5.txt package.json package-lock.json setup-clean.cmd src/providers/gemini.js test/regression.test.js
          git commit -m 'chore: finalize v0.23.5 release metadata'
          git push origin HEAD:audit/v0.23.5
