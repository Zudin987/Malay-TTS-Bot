name: Prepare v0.23.4 Release

on:
  push:
    branches: ['release/v0.23.4']

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.23.4
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Update release metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          VERSION = '0.23.4'

          def write_json(path, data):
              Path(path).write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          package['version'] = VERSION
          write_json('package.json', package)

          lock = json.loads(Path('package-lock.json').read_text(encoding='utf-8'))
          lock['version'] = VERSION
          if isinstance(lock.get('packages', {}).get(''), dict):
              lock['packages']['']['version'] = VERSION
          write_json('package-lock.json', lock)

          setup = Path('setup-clean.cmd').read_text(encoding='utf-8')
          setup = setup.replace('clean setup v0.23.3', 'clean setup v0.23.4')
          Path('setup-clean.cmd').write_text(setup, encoding='utf-8')

          gemini = Path('src/providers/gemini.js').read_text(encoding='utf-8')
          gemini = gemini.replace("malay-tts-bot/0.23.3", "malay-tts-bot/0.23.4")
          Path('src/providers/gemini.js').write_text(gemini, encoding='utf-8')

          regression = Path('test/regression.test.js').read_text(encoding='utf-8')
          regression = regression.replace("v0.23.3 defaults keep short Live audio-end grace and current speaker/message gain", "v0.23.4 defaults keep adaptive Live audio-end grace and current speaker/message gain")
          regression = regression.replace("v0.23.3 voice pool is restricted to Charon, Enceladus, Aoede and Despina", "v0.23.4 voice pool is restricted to Charon, Enceladus, Aoede and Despina")
          Path('test/regression.test.js').write_text(regression, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('# Malay TTS Bot — v0.23.3 — Adaptive Quota Failover', '# Malay TTS Bot — v0.23.4 — Audit Hardening')
          readme = readme.replace('## v0.23.3 highlights', '## v0.23.4 highlights')
          marker = '## v0.23.4 highlights\n\n'
          hardening = '''- **Adaptive Gemini Live audio-end grace.** Missing/delayed completion metadata no longer clips healthy audio after a fixed 650 ms gap; ordinary `generationComplete` turns still close audio immediately.\n- **HTTP-200 Gemini TTS SSE errors are classified correctly.** RPD/daily quota, auth, permission, config/request and retryable transport failures now feed the same provider-health logic as HTTP failures.\n- **Cutoff recovery keeps ownership metadata.** Recovery items preserve the originating Discord message ID and voice-channel ID.\n- **Less hot-path disk I/O.** Non-critical guild normalization and automatic voice-assignment persistence are coalesced briefly, while explicit settings/privacy writes remain synchronous.\n- **FFmpeg path lookup is cached.** Repeated playback avoids redundant filesystem probes and automatically invalidates when `FFMPEG_PATH` changes.\n- **Unicode-safe speaker labels.** ZWJ emoji sequences are preserved and the 80-character safety limit truncates by grapheme cluster.\n- **Single-instance lock race hardened.** Lock ownership now includes a nonce and stale/corrupt lock replacement requires exact-record revalidation before deletion.\n- **Windows CI added.** The full Node 24 regression suite now runs on both Ubuntu and Windows, with Ubuntu also probing the real FFmpeg/libopus filter path.\n\n'''
          if hardening.strip() not in readme:
              readme = readme.replace(marker, marker + hardening, 1)
          readme = readme.replace('v0.23.3 ships new defaults/fields', 'v0.23.4 ships new defaults/fields')
          readme = readme.replace('v0.23.3 retains the hardened prompts/recovery', 'v0.23.4 retains the hardened prompts/recovery')
          readme_path.write_text(readme, encoding='utf-8')

          old_release = Path('RELEASE-v0.23.3.txt')
          if old_release.exists():
              old_release.unlink()

          Path('RELEASE-v0.23.4.txt').write_text('''Malay TTS Bot v0.23.4 — Audit Hardening\n\nSource: v0.23.3 Adaptive Quota Failover clean release.\nPriority: latency > quality > features.\n\nCorrectness / latency hardening:\n- Gemini Live no longer treats a fixed 650 ms post-audio gap as proof the stream ended when completion metadata is missing. The fallback grace now protects the first gap for at least 900 ms and adapts to observed chunk cadence, while generationComplete still closes normal audio promptly.\n- Gemini Live cancellation preserves daily-quota, permission and config classification flags so provider-health decisions remain accurate after aborts.\n- Gemini 3.1 TTS now classifies HTTP-200 SSE failure events for quota/RPD, auth, permission, request/config, retryability and transport behavior instead of surfacing an untyped generic stream error.\n- Cutoff recovery preserves messageId and voiceChannelId so recovered work stays owned by the original Discord message/channel.\n- Non-critical guild normalization and automatic voice assignment writes are coalesced off the immediate hot path; explicit settings/privacy mutations remain synchronous and durable.\n- FFmpeg executable resolution is cached and invalidates when FFMPEG_PATH changes.\n- Speaker-label cleanup preserves Unicode ZWJ sequences and truncates by grapheme cluster.\n- Single-instance locking now records a per-process nonce and revalidates the exact stale/corrupt lock record before deleting it, closing the stale-lock replacement race.\n\nValidation:\n- Regression suite expanded from 45 to 52 tests.\n- Added healthy 700 ms Gemini Live inter-chunk jitter coverage.\n- Added HTTP-200 SSE RPD/daily quota coverage.\n- Added recovery ownership metadata, grapheme-label, atomic guild JSON backup, stale-lock race and corrupt-lock recovery coverage.\n- Node 24 CI passes on Ubuntu and Windows.\n- Ubuntu CI also passes the actual FFmpeg volume + limiter + libopus/Ogg encode/decode probe.\n- npm ci reports 0 dependency vulnerabilities in CI.\n\nRetained:\n- Provider order remains Gemini 3.1 Live -> Gemini 2.5 Live -> Gemini 3.1 TTS -> Google Malay TTS.\n- Voice pool remains Charon, Enceladus, Aoede and Despina.\n- One Discord message = one TTS item. No message merging and no multi-turn Gemini Live reuse.\n- Speaker username remains separate Google Malay TTS audio and is never inserted into Gemini message text.\n- Clean audio defaults remain fixedVolume 0.60 and speakerLabel.gain 1.50.\n- Free-first / billing-disabled operating model remains unchanged.\n\nUpgrade:\nPreserve only .env and data\\guilds.json. Do not restore an old config\\settings.json. Replace the old folder with the v0.23.4 clean package, restore those two files, then run setup-clean.cmd.\n''', encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript and JSON
        shell: bash
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const files = ['package.json', 'package-lock.json', ...fs.readdirSync('config').filter((x) => x.endsWith('.json')).map((x) => path.join('config', x))];
          for (const file of files) JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log(`Validated ${files.length} JSON file(s).`);
          NODE

      - name: Regression tests
        run: npm test

      - name: Release hygiene
        shell: bash
        run: |
          test ! -e RELEASE-v0.23.3.txt
          test -e RELEASE-v0.23.4.txt
          test "$(node -p "require('./package.json').version")" = "0.23.4"
          test "$(node -p "require('./package-lock.json').version")" = "0.23.4"
          ! grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude='.github/workflows/v0234-release-prep.yml' '0\.23\.3' README.md setup-clean.cmd src test package.json package-lock.json RELEASE-v0.23.4.txt
          test ! -e .env
          test ! -e data/guilds.json
          test ! -d data/speaker-label-cache
          test ! -d runtime

      - name: Commit release metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No release metadata changes to commit.'
            exit 0
          fi
          git commit -m 'chore: finalize v0.23.4 release metadata'
          git push origin HEAD:release/v0.23.4
