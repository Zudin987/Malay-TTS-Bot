name: Apply v0.23.5 Deep Audit Fixes

on:
  push:
    branches: ['audit/v0.23.5']
    paths:
      - '.github/workflows/v0235-audit-apply.yml'
      - 'audit-v0235-files.tar.xz'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v0.23.5
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate and apply audited source bundle
        shell: bash
        run: |
          set -euo pipefail
          sha256sum audit-v0235-files.tar.xz
          mapfile -t entries < <(tar -tJf audit-v0235-files.tar.xz)
          printf '%s\n' "${entries[@]}"
          for entry in "${entries[@]}"; do
            case "$entry" in
              /*|../*|*/../*|*/..) echo "Unsafe archive path: $entry" >&2; exit 1 ;;
            esac
          done
          tar -xJf audit-v0235-files.tar.xz
          rm -f audit-v0235-files.tar.xz .github/workflows/v0235-audit-apply.yml

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript and JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
          node -e "const fs=require('fs'),p=require('path'); const files=['package.json','package-lock.json',...fs.readdirSync('config').filter(x=>x.endsWith('.json')).map(x=>p.join('config',x))]; for(const f of files) JSON.parse(fs.readFileSync(f,'utf8')); console.log('Validated '+files.length+' JSON file(s).')"

      - name: Regression tests
        run: npm test

      - name: Release hygiene and diff check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .env
          test ! -e data/guilds.json
          test ! -e data/speaker-label-cache
          test ! -e runtime
          test ! -e bot.log
          test ! -e bot-old.log

      - name: Commit audited fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: v0.23.5 deep audit hardening'
          git push origin HEAD:audit/v0.23.5
