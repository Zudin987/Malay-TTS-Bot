name: Prepare v0.23.20 metadata

on:
  push:
    branches:
      - release/v0.23.20-gemini-tts-repair

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Prepare release metadata and validate
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.23.20 --no-git-tag-version

          python3 - <<'PY'
          from pathlib import Path

          p = Path('setup-clean.cmd')
          s = p.read_text()
          if 'clean setup v0.23.19' not in s:
              raise SystemExit('setup-clean v0.23.19 banner not found')
          p.write_text(s.replace('clean setup v0.23.19', 'clean setup v0.23.20', 1))

          p = Path('MAINTENANCE.md')
          s = p.read_text()
          old = 'Current stable baseline: **v0.23.19 — Strict Normal TTS**.'
          if old not in s:
              raise SystemExit('maintenance baseline not found')
          s = s.replace(old, 'Current stable baseline: **v0.23.20 — Gemini TTS Repair**.', 1)
          old_chain = '''Keep the normal preference order unless an explicit release changes it:\n\n1. Gemini 3.1 Flash Live\n2. Gemini 2.5 Native Audio Live\n3. Gemini 3.1 Flash TTS\n4. Google Malay TTS fallback\n\nProvider health may temporarily bypass known-bad/quota-limited providers, but recovery must restore the normal preference order after a successful half-open probe.'''
          new_chain = '''For normal Discord read-aloud and `/ask`, literal fidelity takes priority over conversational Live latency:\n\n1. Gemini 3.1 Flash TTS\n2. Google Malay TTS fallback\n\nGemini Live providers remain in the codebase for non-read-aloud/internal compatibility, but user-authored read-aloud text must not be routed through a conversational Live model. Provider health may bypass a known-bad/quota-limited TTS provider and fall back to Google.'''
          if old_chain not in s:
              raise SystemExit('maintenance provider-chain block not found')
          p.write_text(s.replace(old_chain, new_chain, 1))
          PY

          cat > RELEASE-v0.23.20.txt <<'EOF'
          Malay TTS Bot v0.23.20 — Gemini TTS Repair

          Changes
          - Repairs the Gemini 3.1 Flash TTS Interactions streaming request used by normal Discord read-aloud and /ask.
          - Uses the documented Interactions endpoint directly and keeps strict read-aloud/director instructions inside the TTS input instead of a separate system_instruction request field.
          - Keeps gemini-3.1-flash-tts-preview, audio response format, the six curated voices, streaming output, and store=false.
          - Keeps the v0.23.19 fidelity rule: normal chat and /ask bypass conversational Gemini Live and use dedicated Gemini TTS first, then Google Malay TTS fallback.
          - HTTP failures now preserve useful JSON or plain-text server details such as INVALID_ARGUMENT after credential redaction, rather than collapsing to a bare HTTP 400.
          - API-key values, key-like query parameters, Bearer tokens, and Google-style API-key strings are redacted from surfaced Gemini TTS HTTP details.
          - Startup wording now says Gemini TTS is configured rather than claiming it is ready before the first real provider request.

          Unchanged
          - No change to the six-voice pool: Charon, Orus, Schedar, Gacrux, Vindemiatrix, Despina.
          - No change to the queue, FFmpeg/audio settings, Google fallback behavior, privacy opt-out, STOP TTS button, or five-key round-robin.
          - Normal Discord text remains strict read-aloud: it must not be answered, explained, completed, translated, or given extra words.

          Validation note
          - CI validates the request shape, error redaction, full regression suite, dependency audit, and FFmpeg/libopus path without using a private Gemini API key. Actual provider acceptance is therefore verified on the installed bot's first real Gemini TTS request; if Google returns another request error, v0.23.20 will log the sanitized server reason for diagnosis.
          EOF

          npm ci
          npm test
          npm audit --audit-level=high
          find src test -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('package.json')); JSON.parse(fs.readFileSync('package-lock.json')); for (const f of fs.readdirSync('config').filter(x=>x.endsWith('.json'))) JSON.parse(fs.readFileSync('config/'+f));"
          test "$(node -p "require('./package.json').version")" = "0.23.20"
          node -e "const l=require('./package-lock.json'); if(l.version!=='0.23.20'||l.packages[''].version!=='0.23.20') process.exit(1)"
          grep -Fq 'clean setup v0.23.20' setup-clean.cmd
          grep -Fq 'Current stable baseline: **v0.23.20 — Gemini TTS Repair**.' MAINTENANCE.md
          test -f RELEASE-v0.23.20.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json setup-clean.cmd MAINTENANCE.md RELEASE-v0.23.20.txt
          git commit -m 'Prepare v0.23.20 Gemini TTS repair release'
          git rm .github/workflows/temp-prepare-v02320.yml
          git commit -m 'Remove temporary v0.23.20 preparation workflow'
          git push origin HEAD:release/v0.23.20-gemini-tts-repair
