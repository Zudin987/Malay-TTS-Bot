name: Prepare v0.23.9 release

on:
  push:
    branches:
      - release/v0.23.9

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.23.9
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Bump release metadata
        shell: bash
        run: |
          npm version 0.23.9 --no-git-tag-version
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          function replace(path, from, to) {
            const value = fs.readFileSync(path, 'utf8');
            if (!value.includes(from)) throw new Error(`Release target missing in ${path}: ${from}`);
            fs.writeFileSync(path, value.replace(from, to));
          }
          replace('setup-clean.cmd', 'Malay TTS Bot clean setup v0.23.8', 'Malay TTS Bot clean setup v0.23.9');
          replace('MAINTENANCE.md', 'Current stable baseline: **v0.23.8 — Cutoff Recovery & Faster Speaker Labels**.', 'Current stable baseline: **v0.23.9 — Fidelity Prompt Profiles**.');
          const notes = `Malay TTS Bot v0.23.9 — Fidelity Prompt Profiles\n\nHighlights\n\n- Gemini Live and Gemini 3.1 TTS now use separate prompt profiles instead of sharing one long instruction set.\n- Live uses a shorter fidelity-first system instruction plus collision-resistant per-turn speech boundaries.\n- Gemini 3.1 TTS uses a TTS-specific AUDIO PROFILE / DIRECTOR'S NOTES / TRANSCRIPT request structure.\n- Strict read-aloud rules prioritize preserving lexical content and order and explicitly prohibit invented content, answers, translation, completion, paraphrase and rewriting.\n- Malaysian Malay, English and Manglish pronunciation remains neutral, calm and approximately 0.95x conversational pace.\n- Complete square-bracket spans are neutralized for Gemini audio only so native audio-control syntax such as [laughs] is spoken as lexical text rather than executed as a performance direction. Google Malay fallback text is unchanged.\n- Existing collision-safe SPEECH_TEXT_START/END nonce boundaries remain in place.\n- Existing top-level Gemini TTS prompt overrides remain backward-compatible.\n- Editable defaults now live independently under geminiLive.profile and geminiTts.profile in config/settings.json.\n\nRegression coverage\n\n- Separate Live and exact-TTS profile normalization.\n- Collision-resistant transcript boundaries.\n- Square-bracket audio-tag neutralization.\n- Malay shorthand input such as “aku nk pergi kedai” is not expanded into additional words such as “ke”.\n- Prompt builders contain no injected “bro”.\n\nCompatibility\n\n- Provider order is unchanged.\n- Request-scoped Gemini API-key round robin is unchanged.\n- One Discord message remains one TTS item.\n- Gemini Live sessions remain fresh single-turn sessions.\n- v0.23.8 cutoff recovery and speakerLabel.speed behavior remain unchanged.\n- No new runtime dependency or local AI/TTS component was added.\n\nUpgrade\n\nPreserve .env and data\\guilds.json. Replace the old C:\\Malay-TTS-Bot files with the v0.23.9 clean package, restore those files, then run setup-clean.cmd. Use the shipped config\\settings.json if you want the new separate prompt-profile defaults.\n`;
          fs.writeFileSync('RELEASE-v0.23.9.txt', notes);
          NODE
      - name: Validate release candidate
        run: |
          npm ci
          node --check src/providers/gemini.js
          node --check src/providers/gemini-live.js
          node --check src/gemini-speech-text.js
          node --check src/config.js
          node --check src/tts.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); JSON.parse(require('fs').readFileSync('config/settings.json','utf8'));"
          npm test
          npm audit --audit-level=high
      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json setup-clean.cmd MAINTENANCE.md RELEASE-v0.23.9.txt
          git diff --cached --quiet && exit 0
          git commit -m "Release v0.23.9 metadata"
          git push origin HEAD:release/v0.23.9
