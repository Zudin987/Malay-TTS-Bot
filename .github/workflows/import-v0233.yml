name: Import v0.23.3 Stable Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v0233.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .import2/part*.b64 | tr -d '[:space:]' | base64 -d > /tmp/source.tar.gz
          echo '61317417c956469a62ca7ba06366fdff98040bb521489b45a744d2dee378e895  /tmp/source.tar.gz' | sha256sum -c -
          mkdir -p /tmp/source
          tar -xzf /tmp/source.tar.gz -C /tmp/source
          test "$(find /tmp/source -type f | wc -l)" -eq 56
          test ! -e /tmp/source/.env
          test ! -e /tmp/source/data/guilds.json
          test ! -d /tmp/source/node_modules
          test ! -d /tmp/source/runtime
          test ! -d /tmp/source/data/speaker-label-cache
          test ! -e /tmp/source/bot.log
          test ! -e /tmp/source/bot-old.log
          test ! -e /tmp/source/data/bot.lock
          test ! -e /tmp/source/data/stop.request

      - name: Replace staging tree with exact v0.23.3 source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/source/. .
          test ! -d .import
          test ! -d .import2
          test ! -e .github/workflows/import-v0233.yml
          test "$(find . -type f -not -path './.git/*' | wc -l)" -eq 56

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript and JSON
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const files = ['package.json', 'package-lock.json'];
          for (const name of fs.readdirSync('config')) if (name.endsWith('.json')) files.push(path.join('config', name));
          for (const file of files) JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log(`Validated ${files.length} JSON file(s).`);
          NODE

      - name: Regression tests
        run: npm test

      - name: FFmpeg/libopus probe
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=0.20' -af 'volume=0.600,alimiter=limit=0.562341:attack=1.0:release=60.0:level=false' -c:a libopus -f ogg -y /tmp/malay-tts-probe.ogg
          ffmpeg -hide_banner -loglevel error -i /tmp/malay-tts-probe.ogg -f null -

      - name: Commit exact stable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No source changes to commit'; exit 0; }
          git commit -m 'chore: import v0.23.3 stable source'
          git push origin HEAD:main
