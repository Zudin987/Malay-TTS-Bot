name: Prepare v0.23.26 Release Metadata

on:
  push:
    branches:
      - release/v0.23.26

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.23.26
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify source parent
        shell: bash
        run: |
          set -euo pipefail
          PARENT="$(git rev-parse HEAD^)"
          test "$PARENT" = "ae14973d628d975b046a50172d98328a5f0f3e25"

      - name: Prepare metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const version = '0.23.26';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.version !== '0.23.25') throw new Error(`Unexpected package version ${pkg.version}`);
          pkg.version = version;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.version !== '0.23.25' || lock.packages?.['']?.version !== '0.23.25') {
            throw new Error('Unexpected package-lock version');
          }
          lock.version = version;
          lock.packages[''].version = version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);

          const setupPath = 'setup-clean.cmd';
          const setup = fs.readFileSync(setupPath, 'utf8');
          const oldBanner = 'Malay TTS Bot clean setup v0.23.25';
          if (!setup.includes(oldBanner)) throw new Error('Old setup banner not found');
          fs.writeFileSync(setupPath, setup.replace(oldBanner, 'Malay TTS Bot clean setup v0.23.26'));

          const notes = `Malay TTS Bot v0.23.26 - Speech Filter Hardening

What changed
- Normal TTS now filters bare-domain links across modern and uncommon TLDs instead of relying on a small fixed TLD list.
- Common filename/code tokens such as app.js, config.json, notes.txt, archive.zip and photo.png are preserved as normal chat rather than being mistaken for bare-domain links.
- Inline code blocks using single backticks are now silent. If normal text surrounds inline code, only the normal text is spoken.
- Still-image attachment fallback recognition now includes HEIC, HEIF, JXL, TIFF/TIF and JFIF when Discord does not provide MIME metadata.
- Link-only, file-only, GIF-only, video-only, emoji-only and fenced-code-only posts remain completely silent.
- Image-only posts still say "hantar gambar"; mentions/tags and /ask remain speakable.

Preserved behavior
- Normal provider order remains Gemini 3.1 Flash Live -> Gemini 2.5 Native Audio Live -> Gemini 3.1 Flash TTS -> Google Malay TTS.
- /ask remains Gemini 3.1 Flash TTS -> Google Malay TTS with buffered validation/fallback and does not use conversational Live.
- Normal first-audio windows remain 2500/1600/1600ms, overall budget remains 7000ms, Google reserve remains 1200ms, and /ask exact-TTS configured timeout remains 4000ms.
- 10-key round-robin, six-voice pool, strict no-added-words prompts, privacy opt-out, STOP TTS, speaker labels, queue behavior and normal chat latency are unchanged.

Upgrade
Preserve .env and data\\guilds.json. Do not copy old runtime caches, logs, locks, node_modules, or config/settings.json over the new release. Extract the clean package to C:\\Malay-TTS-Bot, restore only .env and data\\guilds.json, then run setup-clean.cmd.`;
          fs.writeFileSync('RELEASE-v0.23.26.txt', `${notes}\n`);
          NODE

          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='0.23.26'||l.version!=='0.23.26'||l.packages[''].version!=='0.23.26') process.exit(1)"
          grep -F "clean setup v0.23.26" setup-clean.cmd
          test -f RELEASE-v0.23.26.txt

      - name: Commit prepared release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json setup-clean.cmd RELEASE-v0.23.26.txt
          git commit -m "Prepare v0.23.26 release metadata"
          git push origin HEAD:release/v0.23.26
