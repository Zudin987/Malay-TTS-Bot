name: Temporary implement ask embed and TTS v0.23.14

on:
  push:
    branches:
      - feature/ask-embed-tts-v02314

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/ask-embed-tts-v02314
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Apply focused patch
        run: python3 .github/temp/ask_patch_v02314.py

      - name: Remove temporary patch files
        shell: bash
        run: |
          rm -f .github/workflows/temp-ask-embed-tts-v02314.yml
          rm -f .github/temp/ask_patch_v02314.py
          rmdir .github/temp 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Full regression tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Validate syntax JSON version and diff
        shell: bash
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
          node -e "const fs=require('fs'),p=require('path'); const files=['package.json','package-lock.json',...fs.readdirSync('config').filter(x=>x.endsWith('.json')).map(x=>p.join('config',x))]; for(const f of files) JSON.parse(fs.readFileSync(f,'utf8'));"
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(p.version!=='0.23.14'||l.version!=='0.23.14'||l.packages[''].version!=='0.23.14') process.exit(1)"
          git diff --check
          test ! -e .github/workflows/temp-ask-embed-tts-v02314.yml
          test ! -e .github/temp/ask_patch_v02314.py

      - name: Commit permanent implementation only
        shell: bash
        run: |
          git config user.name "MrEz"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add /ask embed and spoken reply"
          git push origin HEAD:feature/ask-embed-tts-v02314
