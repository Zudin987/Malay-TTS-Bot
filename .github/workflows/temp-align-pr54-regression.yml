name: Temporary align PR54 regression

on:
  push:
    branches:
      - fix/audit-config-contract-cleanup
    paths:
      - .github/workflows/temp-align-pr54-regression.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/audit-config-contract-cleanup
      - name: Align regression and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/regression.test.js')
          text = path.read_text(encoding='utf-8')
          old = 'assert.equal(normalized.audioPipeline.playbackHardMaxMs, 90000);'
          new = 'assert.equal(normalized.audioPipeline.playbackHardMaxMs, 60000);'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/temp-align-pr54-regression.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/regression.test.js .github/workflows/temp-align-pr54-regression.yml
          git commit -m "Align playback hard-max regression with runtime ceiling"
          git push origin HEAD:fix/audit-config-contract-cleanup
