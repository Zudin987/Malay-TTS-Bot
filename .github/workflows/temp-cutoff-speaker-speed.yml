name: Apply cutoff recovery and speaker speed

on:
  push:
    branches:
      - fix/cutoff-recovery-speaker-speed

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Implement speaker speed and cutoff recovery'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/cutoff-recovery-speaker-speed
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Apply focused patch
        shell: pwsh
        run: python .github/scripts/temp-cutoff-speaker-speed.py
      - name: Validate syntax and regression suite
        shell: pwsh
        run: |
          npm ci
          npm test
          Get-ChildItem -Recurse -File -Filter '*.js' | Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' } | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($_.FullName)" }
          }
          git diff --check
      - name: Commit implementation
        shell: pwsh
        run: |
          git config user.name "MrEz"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git add config/settings.json src/config.js src/speaker-label.js src/providers/gemini-live.js src/audio.js test/regression.test.js
          git commit -m "Implement speaker speed and cutoff recovery"
          git push origin HEAD:fix/cutoff-recovery-speaker-speed
