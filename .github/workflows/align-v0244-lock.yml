name: Align v0.24.4 release metadata

on:
  push:
    branches:
      - audit/google-fallback-v0.24.4
    paths:
      - .github/workflows/align-v0244-lock.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: audit/google-fallback-v0.24.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
      - name: Align package lock and bootstrap audit evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { digestDependencyText } from './scripts/audit-dependencies.mjs';

          const lockPath = 'package-lock.json';
          const oldLock = fs.readFileSync(lockPath, 'utf8');
          const needle = '"version": "0.24.3"';
          let count = 0;
          const newLock = oldLock.replaceAll(needle, (matched) => {
            count += 1;
            return count <= 2 ? '"version": "0.24.4"' : matched;
          });
          if (count < 2) throw new Error(`Expected at least two v0.24.3 root version fields, found ${count}.`);
          const parsed = JSON.parse(newLock);
          if (parsed.version !== '0.24.4' || parsed.packages?.['']?.version !== '0.24.4') {
            throw new Error('package-lock root version metadata was not aligned to 0.24.4.');
          }
          fs.writeFileSync(lockPath, newLock, 'utf8');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.version !== '0.24.4') throw new Error(`package.json version is ${pkg.version}, expected 0.24.4.`);

          const baselinePath = 'scripts/audit-baseline.json';
          const baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf8'));
          Object.assign(baseline, {
            verifiedAt: '2026-09-06T04:06:33Z',
            expiresAt: '2026-09-08T04:01:33Z',
            sourceRunId: 34010634454,
            sourceJobId: 101425710572,
            sourceCommit: 'fe48a87ecd85c19520bae58d9d8338933ec30cc7',
            packageJsonLfSha256: digestDependencyText(fs.readFileSync('package.json', 'utf8')),
            packageLockLfSha256: digestDependencyText(fs.readFileSync(lockPath, 'utf8')),
            vulnerabilities: { info: 0, low: 0, moderate: 0, high: 0, critical: 0, total: 0 }
          });
          fs.writeFileSync(baselinePath, `${JSON.stringify(baseline, null, 2)}\n`, 'utf8');
          console.log(`package.json ${baseline.packageJsonLfSha256}`);
          console.log(`package-lock.json ${baseline.packageLockLfSha256}`);
          NODE
      - name: Verify only intended release metadata changed
        shell: bash
        run: |
          node -e "const p=require('./package-lock.json'); if(p.version!=='0.24.4'||p.packages[''].version!=='0.24.4') process.exit(1)"
          git diff --check
          git diff -- package-lock.json scripts/audit-baseline.json
      - name: Commit aligned metadata
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json scripts/audit-baseline.json
          git commit -m "release: align v0.24.4 lock and audit evidence"
          git push origin HEAD:audit/google-fallback-v0.24.4
