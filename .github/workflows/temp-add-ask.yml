name: Prepare /ask feature

on:
  push:
    branches:
      - feature/ask-command

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[ask-prep]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/ask-command
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Add and validate /ask implementation
        shell: bash
        run: |
          set -euo pipefail

          cat > src/ask.js <<'EOF'
          import { nextGeminiApiKey } from './gemini-key-config.js';

          const API_ROOT = 'https://generativelanguage.googleapis.com/v1beta/models';
          const DEFAULT_MODEL = 'gemini-3.1-flash-lite';
          const DEFAULT_SYSTEM = [
            'You are /ask, a concise chat-answer mode for a private Discord server.',
            'Answer the user directly in the same language and casual register they used, including Malaysian Malay, English, or Manglish.',
            'Sound like a normal chat reply, not an article or report.',
            'Default to one to three short sentences and give only the core answer.',
            'Do not use headings, bullet lists, numbered lists, tables, citations, embeds, image markdown, or image suggestions.',
            'Do not generate or request images. Do not add long background unless the user explicitly asks for detail.',
            'If the question requires current or live information you cannot verify, say so briefly instead of guessing.'
          ].join(' ');

          function finiteNumber(value, fallback) {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : fallback;
          }

          function clamp(value, min, max) {
            return Math.max(min, Math.min(value, max));
          }

          function trimCodePoints(value, maxCharacters) {
            const points = Array.from(String(value ?? '').trim());
            return points.length <= maxCharacters ? points.join('') : points.slice(0, maxCharacters).join('');
          }

          export class AskError extends Error {
            constructor(code, message, { status = null, apiStatus = null } = {}) {
              super(message);
              this.name = 'AskError';
              this.code = code;
              this.status = status;
              this.apiStatus = apiStatus;
            }
          }

          export function getAskOptions(source = undefined) {
            const raw = source && typeof source === 'object' && !Array.isArray(source) ? source : {};
            return {
              enabled: raw.enabled !== false,
              model: String(raw.model || DEFAULT_MODEL).trim() || DEFAULT_MODEL,
              timeoutMs: clamp(finiteNumber(raw.timeoutMs, 8000), 1500, 20000),
              maxQuestionCharacters: Math.floor(clamp(finiteNumber(raw.maxQuestionCharacters, 1000), 50, 1800)),
              maxOutputTokens: Math.floor(clamp(finiteNumber(raw.maxOutputTokens, 160), 32, 512)),
              maxAnswerCharacters: Math.floor(clamp(finiteNumber(raw.maxAnswerCharacters, 450), 120, 1500)),
              temperature: clamp(finiteNumber(raw.temperature, 0.35), 0, 1.5),
              thinkingLevel: ['minimal', 'low', 'medium', 'high'].includes(String(raw.thinkingLevel || '').toLowerCase())
                ? String(raw.thinkingLevel).toLowerCase()
                : 'minimal',
              systemInstruction: String(raw.systemInstruction || '').trim() || DEFAULT_SYSTEM
            };
          }

          export function compactAskAnswer(value, maxCharacters = 450) {
            const limit = Math.floor(clamp(finiteNumber(maxCharacters, 450), 120, 1500));
            let text = String(value ?? '')
              .replace(/!\[[^\]]*\]\([^)]*\)/gu, '')
              .replace(/^\s{0,3}#{1,6}\s*/gmu, '')
              .replace(/^\s*(?:[-*+]\s+|\d+[.)]\s+)/gmu, '')
              .replace(/\s+/gu, ' ')
              .trim();
            if (!text) return '';

            const points = Array.from(text);
            if (points.length <= limit) return text;
            const preview = points.slice(0, limit + 1).join('');
            const floor = Math.floor(limit * 0.55);
            let cut = -1;
            for (const mark of ['. ', '? ', '! ', '; ']) {
              const candidate = preview.lastIndexOf(mark);
              if (candidate >= floor) cut = Math.max(cut, candidate + 1);
            }
            if (cut < floor) {
              const whitespace = preview.lastIndexOf(' ');
              if (whitespace >= floor) cut = whitespace;
            }
            if (cut < 1) cut = limit;
            text = preview.slice(0, cut).trimEnd();
            return `${text}…`;
          }

          export function buildAskRequest(question, options = getAskOptions()) {
            const text = trimCodePoints(question, options.maxQuestionCharacters);
            if (!text) throw new AskError('empty', 'Question is empty.');
            return {
              systemInstruction: { parts: [{ text: options.systemInstruction }] },
              contents: [{ role: 'user', parts: [{ text }] }],
              generationConfig: {
                candidateCount: 1,
                temperature: options.temperature,
                maxOutputTokens: options.maxOutputTokens,
                responseMimeType: 'text/plain',
                thinkingConfig: { thinkingLevel: options.thinkingLevel }
              }
            };
          }

          function responseText(payload) {
            const parts = payload?.candidates?.[0]?.content?.parts;
            if (!Array.isArray(parts)) return '';
            return parts.map((part) => typeof part?.text === 'string' ? part.text : '').filter(Boolean).join(' ');
          }

          function apiFailure(status, payload) {
            const apiStatus = String(payload?.error?.status || '').trim() || null;
            const apiMessage = String(payload?.error?.message || '').trim();
            const haystack = `${apiStatus || ''} ${apiMessage}`;
            if (status === 429 || /RESOURCE_EXHAUSTED|quota|rate.?limit/iu.test(haystack)) {
              return new AskError('quota', 'Gemini is rate-limited right now.', { status, apiStatus });
            }
            if (status === 401 || status === 403 || /UNAUTHENTICATED|PERMISSION_DENIED/iu.test(haystack)) {
              return new AskError('auth', 'Gemini /ask is not available right now.', { status, apiStatus });
            }
            return new AskError('api', `Gemini /ask returned HTTP ${status}.`, { status, apiStatus });
          }

          export function describeAskError(error) {
            if (error?.code === 'disabled') return '/ask is disabled in config/settings.json.';
            if (error?.code === 'no-key') return 'Gemini /ask is not configured right now.';
            if (error?.code === 'quota') return 'Gemini is rate-limited right now. Try again later.';
            if (error?.code === 'auth') return 'Gemini /ask is unavailable right now.';
            if (error?.code === 'blocked') return 'Gemini could not answer that request.';
            if (error?.code === 'timeout') return 'Gemini took too long to answer. Try again.';
            if (error?.code === 'empty') return 'Ask me a question first.';
            return 'Gemini /ask failed. Try again.';
          }

          export async function askGemini(question, {
            fetchImpl = globalThis.fetch,
            keyEntry = null,
            options = getAskOptions()
          } = {}) {
            if (!options.enabled) throw new AskError('disabled', '/ask is disabled.');
            if (typeof fetchImpl !== 'function') throw new AskError('api', 'Fetch is unavailable.');
            const selectedKey = keyEntry ?? nextGeminiApiKey();
            if (!selectedKey?.key) throw new AskError('no-key', 'No Gemini API key is configured.');

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), options.timeoutMs);
            timer.unref?.();
            let response;
            try {
              response = await fetchImpl(`${API_ROOT}/${encodeURIComponent(options.model)}:generateContent`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-goog-api-key': selectedKey.key,
                  'x-goog-api-client': 'malay-tts-bot/ask'
                },
                body: JSON.stringify(buildAskRequest(question, options)),
                signal: controller.signal
              });
            } catch (error) {
              if (controller.signal.aborted || error?.name === 'AbortError') {
                throw new AskError('timeout', `Gemini /ask timed out after ${options.timeoutMs}ms.`);
              }
              throw error;
            } finally {
              clearTimeout(timer);
            }

            let payload = null;
            try { payload = await response.json(); } catch {}
            if (!response.ok) throw apiFailure(response.status, payload);
            const answer = compactAskAnswer(responseText(payload), options.maxAnswerCharacters);
            if (!answer) {
              const blocked = payload?.promptFeedback?.blockReason || payload?.candidates?.[0]?.finishReason === 'SAFETY';
              throw new AskError(blocked ? 'blocked' : 'api', blocked ? 'Gemini blocked the request.' : 'Gemini returned no text.');
            }
            return { answer, model: options.model, keySlot: selectedKey.slot ?? null };
          }
          EOF

          cat > test/ask-command.test.js <<'EOF'
          import fs from 'node:fs';
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {
            AskError,
            askGemini,
            buildAskRequest,
            compactAskAnswer,
            describeAskError,
            getAskOptions
          } from '../src/ask.js';

          const options = getAskOptions({
            enabled: true,
            model: 'gemini-3.1-flash-lite',
            timeoutMs: 5000,
            maxQuestionCharacters: 1000,
            maxOutputTokens: 160,
            maxAnswerCharacters: 450,
            temperature: 0.35,
            thinkingLevel: 'minimal'
          });

          test('/ask registration is present without loading Discord config', () => {
            const source = fs.readFileSync(new URL('../src/commands.js', import.meta.url), 'utf8');
            assert.match(source, /\.setName\('ask'\)/u);
            assert.match(source, /\.setName\('question'\)/u);
            assert.match(source, /askCommand,/u);
          });

          test('ask request is text-only, concise, and minimal-thinking', () => {
            const request = buildAskRequest('apa beza RAM dengan storage?', options);
            assert.equal(request.contents[0].parts[0].text, 'apa beza RAM dengan storage?');
            assert.equal(request.generationConfig.responseMimeType, 'text/plain');
            assert.equal(request.generationConfig.thinkingConfig.thinkingLevel, 'minimal');
            assert.equal(request.generationConfig.maxOutputTokens, 160);
            assert.equal('tools' in request, false);
            assert.match(request.systemInstruction.parts[0].text, /one to three short sentences/i);
            assert.match(request.systemInstruction.parts[0].text, /Do not generate or request images/i);
          });

          test('ask answer compaction removes article/list/image formatting', () => {
            const source = '# Answer\n- First point\n- Second point\n![pic](https://example.com/a.png)\nDone.';
            assert.equal(compactAskAnswer(source, 450), 'Answer First point Second point Done.');
          });

          test('ask answer hard cap prefers a clean boundary', () => {
            const source = `${'A'.repeat(90)}. ${'B'.repeat(120)}. ${'C'.repeat(120)}.`;
            const compact = compactAskAnswer(source, 120);
            assert.ok(Array.from(compact).length <= 121);
            assert.match(compact, /…$/u);
          });

          test('askGemini makes one request and returns compact text', async () => {
            let calls = 0;
            let captured = null;
            const fetchImpl = async (url, init) => {
              calls += 1;
              captured = { url, init };
              return {
                ok: true,
                status: 200,
                async json() {
                  return { candidates: [{ content: { parts: [{ text: 'RAM is temporary working memory. Storage keeps files long-term.' }] } }] };
                }
              };
            };
            const result = await askGemini('RAM vs storage?', {
              fetchImpl,
              keyEntry: { slot: 2, key: 'test-key' },
              options
            });
            assert.equal(calls, 1);
            assert.match(captured.url, /gemini-3\.1-flash-lite:generateContent$/u);
            assert.equal(captured.init.headers['x-goog-api-key'], 'test-key');
            assert.equal(result.keySlot, 2);
            assert.equal(result.answer, 'RAM is temporary working memory. Storage keeps files long-term.');
          });

          test('quota failure does not retry another key inside /ask', async () => {
            let calls = 0;
            const fetchImpl = async () => {
              calls += 1;
              return {
                ok: false,
                status: 429,
                async json() { return { error: { status: 'RESOURCE_EXHAUSTED', message: 'quota exceeded' } }; }
              };
            };
            await assert.rejects(
              askGemini('hello?', { fetchImpl, keyEntry: { slot: 1, key: 'test-key' }, options }),
              (error) => error instanceof AskError && error.code === 'quota'
            );
            assert.equal(calls, 1);
            assert.equal(describeAskError(new AskError('quota', 'x')), 'Gemini is rate-limited right now. Try again later.');
          });
          EOF

          node <<'EOF'
          const fs = require('fs');
          const commandsPath = 'src/commands.js';
          let commands = fs.readFileSync(commandsPath, 'utf8');
          commands = commands.replace(
            "import { getFfmpegPath } from './ffmpeg.js';",
            "import { getFfmpegPath } from './ffmpeg.js';\nimport { askGemini, describeAskError, getAskOptions } from './ask.js';"
          );
          const marker = "const ttsOptOutCommand = {";
          const askBlock = `const askCommand = {\n  data: new SlashCommandBuilder()\n    .setName('ask')\n    .setDescription('Ask Gemini for a short chat-style answer')\n    .addStringOption((option) =>\n      option\n        .setName('question')\n        .setDescription('What you want to ask')\n        .setRequired(true)\n        .setMinLength(1)\n        .setMaxLength(1000)\n    ),\n\n  async execute(interaction) {\n    const question = interaction.options.getString('question', true);\n    await interaction.deferReply();\n    try {\n      const { answer } = await askGemini(question, { options: getAskOptions(settings.ask) });\n      await interaction.editReply({ content: answer, allowedMentions: { parse: [] } });\n    } catch (error) {\n      console.warn('[ask]', error?.code || error?.name || 'error', error?.status || '');\n      await interaction.editReply({ content: describeAskError(error), allowedMentions: { parse: [] } });\n    }\n  }\n};\n\n`;
          if (!commands.includes(marker)) throw new Error('commands insertion marker missing');
          commands = commands.replace(marker, askBlock + marker);
          commands = commands.replace('export const commands = [\n  ttsPrivacyCommand,', 'export const commands = [\n  askCommand,\n  ttsPrivacyCommand,');
          fs.writeFileSync(commandsPath, commands);

          const settingsPath = 'config/settings.json';
          const settings = JSON.parse(fs.readFileSync(settingsPath, 'utf8'));
          settings.ask = {
            enabled: true,
            model: 'gemini-3.1-flash-lite',
            timeoutMs: 8000,
            maxQuestionCharacters: 1000,
            maxOutputTokens: 160,
            maxAnswerCharacters: 450,
            temperature: 0.35,
            thinkingLevel: 'minimal'
          };
          fs.writeFileSync(settingsPath, JSON.stringify(settings, null, 2) + '\n');

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          readme = readme.replace(
            'The bot is designed to read eligible Discord messages aloud, not answer them. Usernames are spoken separately with Google Malay TTS.',
            'Normal eligible Discord messages remain strict TTS-only and are not treated as questions for the bot to answer. The explicit `/ask` command is the separate opt-in chat-answer path. Usernames are spoken separately with Google Malay TTS.'
          );
          readme = readme.replace(
            '## Gemini API keys',
            `## /ask short chat answers\n\nUse \`/ask question:<text>\` when you intentionally want an AI answer instead of read-aloud TTS. It uses \`gemini-3.1-flash-lite\` with minimal thinking and returns one compact public Discord message, normally 1–3 short sentences. It does not request images, embeds, tables, or long article-style output. Bot-authored \`/ask\` replies are ignored by the normal TTS message handler.\n\n\`/ask\` uses the existing Gemini key selection and makes only one Gemini request per command. A quota failure does not hop to another key inside the same \`/ask\` request.\n\n## Gemini API keys`
          );
          readme = readme.replace(
            'Useful commands: `/join`, `/leave`, `/speaker`, `/changevoice`, `/name`, `/dictionary`, `/restarttts`, `/status`, `/ttsprivacy`, `/ttsoptout`.',
            'Useful commands: `/ask`, `/join`, `/leave`, `/speaker`, `/changevoice`, `/name`, `/dictionary`, `/restarttts`, `/status`, `/ttsprivacy`, `/ttsoptout`.'
          );
          fs.writeFileSync(readmePath, readme);
          EOF

          npm ci
          npm test
          npm audit --audit-level=high
          node --check src/ask.js
          node --check src/commands.js
          node -e "JSON.parse(require('fs').readFileSync('config/settings.json','utf8'))"

      - name: Commit feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ask.js src/commands.js config/settings.json README.md test/ask-command.test.js
          git commit -m '[ask-prep] Add concise /ask chat command'
          git push origin HEAD:feature/ask-command
