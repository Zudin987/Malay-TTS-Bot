name: Fix v0.23.6 lock metadata

on:
  push:
    branches:
      - fix/v0.23.6-lock-metadata

permissions:
  contents: write

jobs:
  fix-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v0.23.6-lock-metadata
      - name: Update only root package-lock versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('package-lock.json')
          text = p.read_text(encoding='utf-8')
          old = '"version": "0.23.5"'
          new = '"version": "0.23.6"'
          if text.count(old) < 2:
              raise SystemExit('Expected at least two v0.23.5 version fields in package-lock.json')
          text = text.replace(old, new, 2)
          p.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff -- package-lock.json
      - name: Commit lock metadata fix when needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lock metadata already correct."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Fix v0.23.6 package-lock metadata"
          git push origin HEAD:fix/v0.23.6-lock-metadata
