name: Temporary provider failover hardening

on:
  push:
    branches:
      - fix/provider-failover-health

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/provider-failover-health
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Patch provider health and diagnostics
        run: python3 .github/scripts/temp-provider-failover-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Run full regression suite
        run: npm test
      - name: Syntax and JSON checks
        shell: bash
        run: |
          node --check src/tts.js
          node --check src/config.js
          node --check test/regression.test.js
          node -e "JSON.parse(require('fs').readFileSync('config/settings.json','utf8')); console.log('settings JSON OK')"
      - name: Remove temporary patch machinery and commit tested changes
        shell: bash
        run: |
          rm .github/workflows/temp-provider-failover-fix.yml
          rm .github/scripts/temp-provider-failover-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Gemini fallback quota probing and diagnostics"
          git push origin HEAD:fix/provider-failover-health
