name: Audit Export Source

on:
  push:
    branches: ['audit/v0.23.5']
    paths:
      - '.github/workflows/audit-export-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v0.23.5
      - name: Remove staging artifacts
        shell: bash
        run: rm -f audit-v0235-files.tar.xz .github/workflows/v0235-audit-apply.yml
      - uses: actions/upload-artifact@v4
        with:
          name: audit-source
          path: |
            .
            !.git/**
            !node_modules/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
# Temporary audit-only workflow; remove before release.
