name: Apply prompt overhaul

on:
  push:
    branches:
      - feat/fidelity-prompt-profiles

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/fidelity-prompt-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply targeted source changes
        run: node scripts/temp-prompt-overhaul.mjs
      - name: Preserve natural-pause style invariant
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const from = 'Calm, relaxed and steady at about 0.95x natural conversational pace. Use connected phrases, minimal emphasis, restrained pitch variation and stable sentence endings.';
          const to = 'Calm, relaxed and steady at about 0.95x natural conversational pace. Use connected phrases with only brief natural clause pauses, minimal emphasis, restrained pitch variation and stable sentence endings.';
          for (const file of ['src/providers/gemini-live.js', 'src/config.js', 'config/settings.json']) {
            const text = fs.readFileSync(file, 'utf8');
            if (!text.includes(from)) throw new Error(`style target missing in ${file}`);
            fs.writeFileSync(file, text.replaceAll(from, to));
          }
          NODE
      - name: Validate syntax and tests
        run: |
          npm ci
          node --check src/providers/gemini.js
          node --check src/providers/gemini-live.js
          node --check src/gemini-speech-text.js
          node --check src/config.js
          node --check src/tts.js
          node --check test/regression.test.js
          npm test
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers/gemini.js src/providers/gemini-live.js src/gemini-speech-text.js src/config.js src/tts.js config/settings.json test/regression.test.js README.md
          git diff --cached --quiet && exit 0
          git commit -m "Separate Gemini Live and TTS fidelity prompts"
          git push origin HEAD:feat/fidelity-prompt-profiles
