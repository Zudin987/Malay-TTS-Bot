name: Temporary v0.23.30 release metadata

on:
  push:
    branches:
      - release/v0.23.30
    paths:
      - .github/workflows/temp-release-v0.23.30.yml

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v7
        with:
          ref: release/v0.23.30
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Bump release metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.23.30 --no-git-tag-version
          python3 - <<'PY'
          from pathlib import Path
          path = Path('setup-clean.cmd')
          text = path.read_text(encoding='utf-8')
          old = 'echo Malay TTS Bot clean setup v0.23.29'
          new = 'echo Malay TTS Bot clean setup v0.23.30'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one setup banner match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cat > RELEASE-v0.23.30.txt <<'EOF'
          Malay TTS Bot v0.23.30 - /ask Lifecycle Hardening

          What changed
          - Fixed rapid same-user /ask ordering so a slower older request cannot finish later and replace the newer request.
          - Added request-owned half-open provider probe leases so stale completion or cancellation callbacks cannot clear a newer request's probe state.
          - Accepted /ask queue items are protected from normal-chat overflow; normal waiting speech is dropped first, and new incoming speech is rejected if every waiting item is protected.
          - A newer same-user /ask may cancel an older current /ask only before the old answer becomes audible. Once speech has started, it is preserved.
          - STOP TTS now races queue cancellation against provider generation, so the queue can advance even if remote Gemini teardown does not settle promptly.
          - Added regression coverage proving STOP releases stuck Gemini limiter ownership and the next normal Gemini 3.1 Live message can begin immediately.

          Preserved behavior
          - Normal Discord chat remains Gemini 3.1 Flash Live -> Gemini 2.5 Native Audio Live -> Gemini 3.1 Flash TTS -> Google Malay TTS.
          - Normal Gemini 3.1 Live provider implementation and timing behavior are unchanged.
          - Normal first-audio windows remain 2500/1600/1600ms, overall first-audio budget remains 7000ms, and Google reserve remains 1200ms.
          - /ask remains separate from conversational Live and uses Gemini 3.1 Flash TTS -> Google Malay TTS fallback.
          - Strict no-added-words behavior, FIFO ownership, privacy controls, six approved Gemini voices and existing /ask text-response behavior are unchanged.

          Upgrade
          Preserve only .env and data\guilds.json from the old install. Do not copy old caches, logs, locks, node_modules, or config\settings.json over the new release. Extract the v0.23.30 Clean package to C:\Malay-TTS-Bot, restore .env and data\guilds.json, then run setup-clean.cmd.
          EOF
          sed -i 's/^          //' RELEASE-v0.23.30.txt

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='0.23.30') process.exit(1)"
          node -e "const p=require('./package-lock.json'); if(p.version!=='0.23.30'||p.packages[''].version!=='0.23.30') process.exit(1)"
          grep -F "Malay TTS Bot clean setup v0.23.30" setup-clean.cmd
          grep -F "Malay TTS Bot v0.23.30 - /ask Lifecycle Hardening" RELEASE-v0.23.30.txt

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src test -type f -name '*.js' -print0)

      - name: Regression tests
        run: npm test

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: Commit release metadata and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Zudin987"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git rm .github/workflows/temp-release-v0.23.30.yml
          git add package.json package-lock.json setup-clean.cmd RELEASE-v0.23.30.txt
          git commit -m "Prepare v0.23.30 release"
          git push origin HEAD:release/v0.23.30
